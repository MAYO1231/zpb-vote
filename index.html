  <style>
    :root {
      --bg: #080810; --surface: #0f0f1c; --card: #14141f; --border: #1e1e2e;
      --gold: #e8b84b; --gold-dim: #a07a1a;
      --red: #c94040; --green: #2d7a4a;
      --text: #e8e4dc; --muted: #5a5870; --dim: #2e2c3f;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes goldPulse {
      0%, 100% { text-shadow: 0 0 40px rgba(232,184,75,0.35), 0 0 80px rgba(232,184,75,0.15); }
      50%       { text-shadow: 0 0 70px rgba(232,184,75,0.65), 0 0 130px rgba(232,184,75,0.3); }
    }

    @keyframes trophyFloat {
      0%, 100% { transform: translateY(0);   filter: drop-shadow(0 0 24px rgba(232,184,75,0.45)); }
      50%       { transform: translateY(-8px); filter: drop-shadow(0 0 44px rgba(232,184,75,0.75)); }
    }

    @keyframes glowIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, input {
      font: inherit;
    }

    button {
      min-height: 42px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b0b15;
      color: var(--text);
      padding: 12px 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold-dim);
    }

    .fade-in { animation: fadeIn 0.3s ease forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite; }

    .banner {
      display: none;
      width: 100%;
      background: #5a1616;
      color: #ffe4e4;
      border-bottom: 1px solid #8f2828;
      padding: 12px 18px;
      text-align: center;
      font-weight: 700;
    }

    .banner.is-visible { display: block; }

    .app-shell {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 75% 0%,   rgba(232,184,75,0.10) 0%, transparent 45%),
        radial-gradient(ellipse at 10% 100%, rgba(201,64,64,0.05)  0%, transparent 35%),
        radial-gradient(circle  at 15% 0%,   rgba(232,184,75,0.05), transparent 28%),
        linear-gradient(180deg, #080810 0%, #0b0b14 100%);
    }

    .host-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(15, 15, 28, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      min-width: 0;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0;
      line-height: 1.1;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-family: "Noto Sans TC", sans-serif;
      font-size: 12px;
      font-weight: 500;
    }

    .reset-btn {
      flex: 0 0 auto;
      border: 1px solid #4a1515;
      border-radius: 8px;
      background: transparent;
      color: #e47979;
      padding: 7px 11px;
      min-height: 34px;
      font-size: 13px;
      font-weight: 700;
    }

    .tabs {
      position: sticky;
      top: 64px;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      background: rgba(15, 15, 28, 0.95);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .tab-btn.is-active {
      color: var(--gold);
      box-shadow: inset 0 -2px 0 var(--gold);
    }

    .host-main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .panel { display: none; }
    .panel.is-active { display: block; }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .card.gold-border,
    .leader-item.gold-border {
      border-color: var(--gold-dim);
      background: #171403;
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--gold);
      font-family: "Noto Serif TC", serif;
      font-size: 19px;
      font-weight: 900;
    }

    .muted {
      color: var(--muted);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 13px;
      color: var(--text);
      background: var(--dim);
      font-weight: 700;
    }

    .btn.primary {
      background: #1a3d1a;
      border-color: #2a6a2a;
      color: #8ce08c;
    }

    .btn.blue {
      background: #17263f;
      border-color: #284a7a;
      color: #91bfff;
    }

    .btn.red {
      background: #3d1a1a;
      border-color: #6a2a2a;
      color: #e89898;
    }

    .btn.vote-p1 {
      background: #151d30;
      border-color: var(--gold);
      border-width: 2px;
    }

    .btn.gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #0a0a10;
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn.full { width: 100%; }

    .qr-card {
      text-align: center;
    }

    .qr-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      min-height: 220px;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
    }

    .round-item,
    .person-item,
    .leader-item,
    .finished-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .round-name {
      color: var(--gold);
      font-weight: 900;
      font-family: "Noto Serif TC", serif;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--dim);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .badge.open {
      background: #17351f;
      color: #83d996;
    }

    .badge.closed {
      background: #342a10;
      color: var(--gold);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .current-round {
      text-align: center;
      padding: 22px 16px;
    }

    .current-round h2,
    .participant-title {
      margin: 0 0 12px;
      color: var(--gold);
      font-family: "Noto Serif TC", serif;
      font-size: 24px;
      font-weight: 900;
    }

    .versus {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      line-height: 1.25;
    }

    .versus span {
      color: var(--muted);
      font-size: 0.56em;
      font-weight: 700;
      margin: 0 8px;
    }

    .vote-chart-shell {
      min-height: 285px;
    }

    .chart-frame {
      position: relative;
      width: min(360px, 100%);
      height: 240px;
      margin: 8px auto 0;
    }

    .empty-state {
      display: flex;
      min-height: 180px;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .participant-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .participant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .participant-main {
      width: min(620px, 100%);
      margin: 0 auto;
      padding: 28px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .join-card {
      width: min(420px, calc(100vw - 36px));
      margin: auto;
    }

    .join-card h1 {
      margin: 0 0 20px;
      color: var(--gold);
      font-family: "Noto Serif TC", serif;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
    }

    .vote-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vote-option {
      width: 100%;
      min-height: 100px;
      border-radius: 14px;
      font-size: 26px;
      font-weight: 900;
      word-break: break-word;
      font-family: "Noto Serif TC", serif;
      letter-spacing: 0.04em;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn.vote-p1:hover {
      background: #1c2d48;
      box-shadow: 0 0 28px rgba(232,184,75,0.22), 0 4px 16px rgba(0,0,0,0.4);
    }

    .btn.red.vote-option:hover {
      background: #4a1f1f;
      box-shadow: 0 0 28px rgba(201,64,64,0.22), 0 4px 16px rgba(0,0,0,0.4);
    }

    .score-big {
      color: var(--gold);
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
    }

    .leader-item.me {
      border-color: var(--gold-dim);
      background: #171403;
    }

    .rank {
      width: 42px;
      flex: 0 0 42px;
      color: var(--gold);
      font-weight: 900;
    }

    .name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .score {
      flex: 0 0 auto;
      color: var(--gold);
      font-weight: 900;
    }

    /* ══════════════════════════════════════════════════════════════
       DISPLAY / PROJECTION MODE — 殿堂光柱
    ══════════════════════════════════════════════════════════════ */

    /* Cathedral fixed background */
    .disp-bg {
      position: fixed; inset: 0; overflow: hidden; z-index: 0;
      background: radial-gradient(ellipse 90% 60% at 50% -10%, #2a1e08 0%, #0a0810 55%, #060508 100%);
    }
    .cath-arch {
      position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: min(1600px, 100%); height: 55%;
      background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(200,155,50,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .cath-rays { position: absolute; inset: 0; opacity: 0.7; transition: opacity 1.5s ease; }
    .cath-rays.is-intense { opacity: 1; }
    .cath-ray { position: absolute; top: 0; transform-origin: 50% 0%; border-radius: 0 0 200px 200px; }
    .cath-ray-1 { left: 10%; width: 6vw;  height: 85vh; background: linear-gradient(180deg, rgba(230,185,80,0.20) 0%, transparent 100%); transform: rotate(-32deg); filter: blur(3px); animation: cathBreath 9s  ease-in-out infinite; }
    .cath-ray-2 { left: 28%; width: 7vw;  height: 80vh; background: linear-gradient(180deg, rgba(255,210,100,0.26) 0%, transparent 100%); transform: rotate(-14deg); filter: blur(2px); animation: cathBreath 11s ease-in-out infinite 1.3s; }
    .cath-ray-3 { left: 47%; width: 7vw;  height: 76vh; background: linear-gradient(180deg, rgba(255,215,110,0.30) 0%, transparent 100%); transform: rotate(2deg);   filter: blur(2px); animation: cathBreath 8s  ease-in-out infinite 0.6s; }
    .cath-ray-4 { left: 64%; width: 6vw;  height: 72vh; background: linear-gradient(180deg, rgba(220,170,60,0.20) 0%, transparent 100%); transform: rotate(18deg);  filter: blur(3px); animation: cathBreath 13s ease-in-out infinite 2.4s; }
    .cath-ray-5 { left: 78%; width: 5vw;  height: 65vh; background: linear-gradient(180deg, rgba(230,185,80,0.15) 0%, transparent 100%); transform: rotate(34deg);  filter: blur(4px); animation: cathBreath 10s ease-in-out infinite 3.8s; }
    @keyframes cathBreath { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    .cath-floor {
      position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
      background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(200,155,50,0.12) 0%, transparent 70%);
    }
    .cath-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.72) 100%);
    }
    .disp-dust {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; pointer-events: none;
    }

    /* Display root layout */
    .disp-root {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: clamp(24px,4vh,60px) clamp(20px,5vw,80px);
      text-align: center; gap: clamp(10px,2vh,24px);
    }
    .disp-content {
      position: relative; z-index: 5;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(10px,2vh,28px); width: 100%;
    }
    .disp-verse {
      position: fixed; bottom: clamp(14px,2.5vh,36px); left: 0; right: 0; z-index: 6;
      text-align: center; pointer-events: none;
      font-family: "Noto Serif TC", serif; font-size: clamp(12px,1.4vw,20px);
      font-weight: 700; letter-spacing: 0.24em; color: rgba(240,200,80,0.25);
    }

    /* shared display elements */
    .disp-round-label {
      font-size: clamp(13px,1.8vw,26px); font-weight: 500;
      letter-spacing: 0.28em; color: rgba(240,200,80,0.55);
    }
    .disp-main-title {
      font-family: "Noto Serif TC", serif; font-size: clamp(48px,9vw,120px);
      font-weight: 900; line-height: 1.05; letter-spacing: 0.06em; color: #f0c96e;
      text-shadow: 0 0 60px rgba(240,200,80,0.4), 0 0 120px rgba(240,200,80,0.2);
    }
    .disp-subtitle {
      font-size: clamp(13px,1.6vw,28px); font-weight: 400;
      letter-spacing: 0.18em; color: rgba(240,200,80,0.42);
    }
    .disp-divider {
      width: 60px; height: 1px; margin: clamp(6px,1.2vh,18px) auto;
      background: linear-gradient(90deg, transparent, rgba(240,200,80,0.5), transparent);
    }
    .disp-join-label {
      font-size: clamp(13px,1.8vw,26px); letter-spacing: 0.2em;
      font-weight: 500; color: rgba(240,200,80,0.65);
    }
    .disp-qr-wrap {
      background: #fff; padding: clamp(8px,1vw,14px); border-radius: 10px;
      box-shadow: 0 0 60px rgba(240,200,80,0.35), 0 0 120px rgba(240,200,80,0.15);
      display: inline-block; font-size: 0; line-height: 0;
    }
    .disp-join-url {
      font-size: clamp(10px,1.1vw,16px); color: rgba(240,200,80,0.28); letter-spacing: 0.08em;
    }
    .disp-waiting-text {
      font-size: clamp(13px,1.8vw,22px); letter-spacing: 0.14em;
      color: rgba(200,200,220,0.38); animation: pulse 2.4s ease-in-out infinite;
    }

    /* pending vs row */
    .disp-versus-row {
      display: flex; align-items: center; justify-content: center;
      gap: clamp(16px,4vw,80px); width: 100%;
    }
    .disp-player-name {
      font-family: "Noto Serif TC", serif; font-size: clamp(36px,7vw,100px);
      font-weight: 900; line-height: 1.1; flex: 1; max-width: clamp(260px,40vw,600px);
    }
    .disp-p1-name { color: #f0c96e; text-shadow: 0 0 40px rgba(240,200,80,0.35); }
    .disp-p2-name { color: #e07060; text-shadow: 0 0 40px rgba(220,100,80,0.35); }
    .disp-vs-text {
      font-family: "Noto Serif TC", serif; font-size: clamp(18px,2.5vw,40px);
      font-weight: 700; color: rgba(200,200,220,0.28); letter-spacing: 0.1em;
    }

    /* voting grid */
    .disp-vote-grid {
      display: grid; grid-template-columns: 1fr clamp(36px,5.5vw,72px) 1fr;
      align-items: center; width: 100%; max-width: min(1400px,96vw);
    }
    .disp-vote-card {
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(6px,1.4vh,18px);
      padding: clamp(18px,2.8vw,52px) clamp(14px,2.2vw,40px);
      border-radius: clamp(10px,1.4vw,20px);
    }
    .disp-vc-p1 { background: rgba(240,200,80,0.05); border: 1px solid rgba(240,200,80,0.18); }
    .disp-vc-p2 { background: rgba(220,100,80,0.05); border: 1px solid rgba(220,100,80,0.18); }
    .disp-vc-name {
      font-family: "Noto Serif TC", serif; font-size: clamp(22px,4.5vw,70px);
      font-weight: 900; line-height: 1.1;
    }
    .disp-vc-p1 .disp-vc-name { color: #f0c96e; }
    .disp-vc-p2 .disp-vc-name { color: #e07060; }
    .disp-vc-count {
      font-family: "Noto Serif TC", serif; font-size: clamp(60px,12vw,155px);
      font-weight: 900; line-height: 0.9; animation: glowIn 0.4s ease forwards;
    }
    .disp-vc-p1 .disp-vc-count { color: #f0c96e; }
    .disp-vc-p2 .disp-vc-count { color: #e07060; }
    .disp-vc-bar-wrap {
      width: 100%; height: clamp(5px,0.55vh,9px); border-radius: 4px;
      background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .disp-vc-bar {
      height: 100%; border-radius: 4px;
      transition: width 0.8s cubic-bezier(0.34,1.2,0.64,1);
    }
    .disp-vc-bar-p1 { background: #f0c96e; box-shadow: 0 0 14px rgba(240,200,80,0.6); }
    .disp-vc-bar-p2 { background: #e07060; box-shadow: 0 0 14px rgba(220,100,80,0.6); }
    .disp-vc-pct {
      font-size: clamp(13px,1.5vw,24px); font-weight: 700;
      color: rgba(200,200,220,0.48); letter-spacing: 0.08em;
    }
    .disp-vote-vs-col {
      display: flex; flex-direction: column; align-items: center;
      gap: clamp(6px,1.5vh,18px);
    }
    .disp-vs-pill {
      font-family: "Noto Serif TC", serif; font-size: clamp(13px,1.6vw,26px);
      font-weight: 900; color: rgba(200,200,220,0.2); letter-spacing: 0.15em;
    }
    .disp-voter-count {
      font-size: clamp(10px,1.2vw,17px); color: rgba(200,200,220,0.36);
      letter-spacing: 0.06em; line-height: 1.6; writing-mode: vertical-rl;
    }

    /* winner */
    .disp-trophy {
      font-size: clamp(64px,13vw,150px); line-height: 1;
      animation: trophyFloat 2.8s ease-in-out infinite;
    }
    .disp-winner-name {
      font-family: "Noto Serif TC", serif; font-size: clamp(50px,10.5vw,125px);
      font-weight: 900; color: #f0c96e; line-height: 1.1; word-break: break-word;
      animation: goldPulse 2.8s ease-in-out infinite, glowIn 0.6s ease forwards;
    }
    .disp-winner-sub {
      font-size: clamp(13px,1.8vw,26px); color: rgba(200,200,220,0.42); letter-spacing: 0.24em;
    }
    .disp-winner-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at 50% 35%, rgba(240,200,80,0.14), transparent 60%);
      animation: pulse 3s ease-in-out infinite;
    }

    /* finals */
    .disp-final-title {
      font-family: "Noto Serif TC", serif; font-size: clamp(22px,3.8vw,52px);
      font-weight: 900; color: #f0c96e; letter-spacing: 0.1em;
    }
    .disp-rankings {
      display: flex; flex-direction: column; gap: clamp(5px,1vh,12px);
      width: 100%; max-width: min(680px,90vw);
    }
    .disp-rank-row {
      display: flex; align-items: center; gap: clamp(10px,2vw,26px);
      padding: clamp(9px,1.4vh,20px) clamp(10px,1.8vw,30px);
      border-radius: clamp(7px,1vw,13px);
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    }
    .disp-rank-row.is-first { border-color: rgba(240,200,80,0.5); background: rgba(240,200,80,0.06); }
    .disp-rank-medal { font-size: clamp(20px,2.8vw,38px); min-width: clamp(30px,3.5vw,50px); }
    .disp-rank-name  { flex: 1; font-family: "Noto Serif TC",serif; font-size: clamp(17px,2.4vw,36px); font-weight: 700; text-align: left; }
    .disp-rank-score { font-family: "Noto Serif TC",serif; font-size: clamp(24px,3.2vw,48px); font-weight: 900; color: #f0c96e; }
    .disp-rank-unit  { font-size: 0.55em; color: rgba(200,200,220,0.42); }

    @media (max-width: 720px) {
      .grid,
      .form-row {
        grid-template-columns: 1fr;
      }

      .host-header {
        align-items: flex-start;
      }

      .tabs {
        top: 62px;
      }

      .tab-btn {
        font-size: 11px;
        padding-inline: 1px;
      }

      .host-main {
        padding: 14px;
      }

      .row {
        align-items: flex-start;
        flex-direction: column;
      }

      .row .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="config-banner" class="banner">⚠️ 請先填入 Firebase 設定</div>
  <div id="app" class="app-shell"></div>

  <script>
    (() => {
      const DEFAULT_GAME = { phase: "setup", currentRoundIdx: 0, rounds: [] };
      const TABS = [
        ["setup", "場次"],
        ["game", "遊戲"],
        ["display", "直播"],
        ["roster", "名單"],
        ["leaderboard", "排名"]
      ];

      const HOST_PASS = "594131";
      let hostAuthed = sessionStorage.getItem("host-auth") === "1";

      let db = null;
      let game = DEFAULT_GAME;
      let participants = [];
      let predictions = [];
      let hostTab = "setup";
      let hostMounted = false;
      let participantMounted = false;
      let participantName = getNameParam();
      let gamePanelSignature = "";
      let setupPanelSignature = "";
      let voteChart = null;
      let voteChartRoundId = "";
      let qrSignature = "";
      let dustRaf = null;
      let displayMode = "auto";   // "auto" | "qr" | "current" | "leaderboard" | "champion"
      let displayChampion = "";
      let editingRoundId = null;

      const app = document.getElementById("app");
      const banner = document.getElementById("config-banner");

      function getMode() {
        return new URLSearchParams(location.search).get("mode");
      }

      function getNameParam() {
        const n = new URLSearchParams(location.search).get("name");
        return n ? decodeURIComponent(n) : "";
      }

      function pushNameToURL(name) {
        const url = new URL(location.href);
        url.searchParams.set("mode", "join");
        url.searchParams.set("name", encodeURIComponent(name));
        history.pushState({}, "", url.toString());
      }

      function isFirebaseConfigured() {
        return FIREBASE_CONFIG &&
          typeof FIREBASE_CONFIG.databaseURL === "string" &&
          FIREBASE_CONFIG.databaseURL.length > 0 &&
          !FIREBASE_CONFIG.databaseURL.includes("YOUR_PROJECT");
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[ch]);
      }

      function firebaseKeyIsValid(value) {
        return value && !/[.#$/\[\]]/.test(value);
      }

      function normalizeRounds(rawRounds) {
        if (Array.isArray(rawRounds)) {
          return rawRounds.filter(Boolean);
        }
        if (rawRounds && typeof rawRounds === "object") {
          return Object.keys(rawRounds)
            .sort((a, b) => Number(a) - Number(b))
            .map((key) => rawRounds[key])
            .filter(Boolean);
        }
        return [];
      }

      function normalizeGame(rawGame) {
        if (!rawGame || typeof rawGame !== "object") {
          return { ...DEFAULT_GAME, rounds: [] };
        }
        return {
          phase: rawGame.phase || "setup",
          currentRoundIdx: Number(rawGame.currentRoundIdx) || 0,
          rounds: normalizeRounds(rawGame.rounds).map((round) => ({
            id: round.id,
            label: round.label,
            p1: round.p1,
            p2: round.p2,
            status: round.status || "pending",
            winner: round.winner ?? null
          }))
        };
      }

      function getCurrentRound() {
        if (game.phase !== "active") return null;
        if (game.currentRoundIdx < 0 || game.currentRoundIdx >= game.rounds.length) return null;
        return game.rounds[game.currentRoundIdx];
      }

      function getPredictionsForRound(roundId) {
        return predictions.filter((prediction) => prediction.roundId === roundId);
      }

      function predictionKey(name, roundId) {
        return `${name}_${roundId}`;
      }

      function currentParticipantPrediction(round) {
        if (!participantName || !round) return null;
        return predictions.find((prediction) => prediction.name === participantName && prediction.roundId === round.id) || null;
      }

      function closedRounds() {
        return game.rounds.filter((round) => round.status === "closed" && round.winner);
      }

      function correctCountFor(name) {
        return predictions.filter((prediction) => {
          if (prediction.name !== name) return false;
          const round = game.rounds.find((item) => item.id === prediction.roundId);
          return round && round.status === "closed" && round.winner === prediction.pick;
        }).length;
      }

      function getRankings() {
        const rows = participants.map((person) => ({
          name: person.name,
          correct: correctCountFor(person.name)
        })).sort((a, b) => {
          if (b.correct !== a.correct) return b.correct - a.correct;
          return a.name.localeCompare(b.name, "zh-Hant");
        });

        let lastScore = null;
        let lastRank = 0;
        rows.forEach((row, index) => {
          if (row.correct !== lastScore) {
            lastRank = index + 1;
            lastScore = row.correct;
          }
          row.rank = lastRank;
        });
        return rows;
      }

      function rankLabel(rank) {
        if (rank === 1) return "🥇";
        if (rank === 2) return "🥈";
        if (rank === 3) return "🥉";
        return String(rank);
      }

      function getJoinURL() {
        const url = new URL(location.href);
        url.searchParams.set("mode", "join");
        url.searchParams.delete("name");
        return url.toString();
      }

      function setVisible(element, visible) {
        if (!element) return;
        element.style.display = visible ? "" : "none";
      }

      function render() {
        if (getMode() === "display") {
          renderDisplay();
        } else if (getMode() === "join") {
          renderParticipant();
        } else {
          renderHost();
        }
      }

      function openDisplayWindow() {
        const url = new URL(location.href);
        url.searchParams.set("mode", "display");
        url.searchParams.delete("name");
        const win = window.open(url.toString(), "_blank", "width=1280,height=720");
        if (!win) alert("請在瀏覽器允許此頁面開啟彈出視窗後再試");
      }

      // ── Cathedral dust motes ─────────────────────────────────────
      function startDisplayDustMotes() {
        if (dustRaf) { cancelAnimationFrame(dustRaf); dustRaf = null; }
        const cvs = document.getElementById("disp-dust");
        if (!cvs) return;
        const ctx = cvs.getContext("2d");
        function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
        resize();
        const onResize = () => resize();
        window.addEventListener("resize", onResize);
        const count = 110;
        const motes = Array.from({ length: count }, () => ({
          x: Math.random() * cvs.width,
          y: Math.random() * cvs.height,
          r: 0.6 + Math.random() * 2.2,
          vx: -0.05 + Math.random() * 0.1,
          vy: -0.14 - Math.random() * 0.28,
          tw: Math.random() * Math.PI * 2,
          a: 0.14 + Math.random() * 0.52,
        }));
        let last = performance.now();
        function tick(t) {
          const dt = Math.min(50, t - last) / 16.67;
          last = t;
          const W = cvs.width, H = cvs.height;
          ctx.clearRect(0, 0, W, H);
          for (const m of motes) {
            m.x += m.vx * dt; m.y += m.vy * dt; m.tw += 0.018 * dt;
            if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
            if (m.x < -10) m.x = W + 10;
            if (m.x > W + 10) m.x = -10;
            const a = m.a * (0.55 + 0.45 * Math.sin(m.tw));
            const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 4);
            g.addColorStop(0, `rgba(255,220,150,${a})`);
            g.addColorStop(1, "rgba(255,220,150,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.r * 4, 0, Math.PI * 2);
            ctx.fill();
          }
          dustRaf = requestAnimationFrame(tick);
        }
        dustRaf = requestAnimationFrame(tick);
      }

      // ── Cathedral background HTML ─────────────────────────────
      function dispBgHTML(intense) {
        return `
          <div class="disp-bg">
            <div class="cath-arch"></div>
            <div class="cath-rays${intense ? " is-intense" : ""}">
              <div class="cath-ray cath-ray-1"></div>
              <div class="cath-ray cath-ray-2"></div>
              <div class="cath-ray cath-ray-3"></div>
              <div class="cath-ray cath-ray-4"></div>
              <div class="cath-ray cath-ray-5"></div>
            </div>
            <div class="cath-floor"></div>
            <div class="cath-vignette"></div>
            <canvas id="disp-dust" class="disp-dust"></canvas>
          </div>
          <div class="disp-verse">你的杖，你的杆，都安慰我</div>`;
      }

      function renderDisplay() {
        hostMounted = false;
        participantMounted = false;
        if (dustRaf) { cancelAnimationFrame(dustRaf); dustRaf = null; }
        app.style.background = "transparent";

        // ── 手動直播模式覆蓋 ──────────────────────────────────────
        if (displayMode === "qr") {
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(false)}
              <div class="disp-content">
                <div class="disp-main-title">你的杖，你的杆，都擊打我</div>
                <div class="disp-subtitle">盲眼劍客猜勝負</div>
                <div class="disp-divider"></div>
                <div class="disp-join-label">掃描加入・一起見證</div>
                <div class="disp-qr-wrap" id="disp-qr-box"></div>
                <div class="disp-join-url">${escapeHTML(getJoinURL())}</div>
              </div>
            </div>`;
          const qrBox = document.getElementById("disp-qr-box");
          if (qrBox && typeof QRCode !== "undefined") {
            const s = Math.min(Math.max(Math.round(window.innerWidth * 0.14), 150), 240);
            new QRCode(qrBox, { text: getJoinURL(), width: s, height: s, colorDark: "#111", colorLight: "#fff" });
          }
          startDisplayDustMotes();
          return;
        }

        if (displayMode === "leaderboard") {
          const rankings = getRankings();
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(false)}
              <div class="disp-content">
                <div class="disp-final-title">🏅 即時排名</div>
                <div class="disp-rankings">
                  ${rankings.length === 0
                    ? `<div class="disp-waiting-text">等待參與者加入...</div>`
                    : rankings.map((row, i) => `
                      <div class="disp-rank-row ${i === 0 ? "is-first" : ""}">
                        <span class="disp-rank-medal">${rankLabel(row.rank)}</span>
                        <span class="disp-rank-name">${escapeHTML(row.name)}</span>
                        <span class="disp-rank-score">${row.correct}<span class="disp-rank-unit"> 場</span></span>
                      </div>`).join("")}
                </div>
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        if (displayMode === "champion") {
          const name = displayChampion;
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(true)}
              <div class="disp-winner-bg"></div>
              <div class="disp-content">
                ${name
                  ? `<div class="disp-trophy">🏆</div>
                     <div class="disp-winner-name">${escapeHTML(name)}</div>
                     <div class="disp-winner-sub">恭喜獲得最終冠軍！</div>`
                  : `<div class="disp-waiting-text">等待公布冠軍...</div>`}
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        // displayMode === "current" → 跳過 phase 判斷，直接顯示當前場次
        if (displayMode === "current") {
          const round = getCurrentRound();
          if (!round) {
            app.innerHTML = `
              <div class="disp-root fade-in">
                ${dispBgHTML(false)}
                <div class="disp-content"><div class="disp-waiting-text">尚無進行中的場次</div></div>
              </div>`;
            startDisplayDustMotes();
            return;
          }
          // fall through to per-round rendering below
          renderDisplayRound(round);
          return;
        }

        // ── auto 模式（原本邏輯）────────────────────────────────────
        const round = getCurrentRound();
        const intense = (round && round.status === "closed") || game.phase === "finished";

        if (game.phase === "setup") {
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(false)}
              <div class="disp-content">
                <div class="disp-main-title">你的杖，你的杆</div>
                <div class="disp-subtitle">都擊打我・盲眼劍客猜勝負</div>
                <div class="disp-divider"></div>
                <div class="disp-join-label">掃描加入・一起見證</div>
                <div class="disp-qr-wrap" id="disp-qr-box"></div>
                <div class="disp-waiting-text">等待遊戲開始...</div>
              </div>
            </div>`;
          const qrBox = document.getElementById("disp-qr-box");
          if (qrBox && typeof QRCode !== "undefined") {
            const s = Math.min(Math.max(Math.round(window.innerWidth * 0.14), 150), 240);
            new QRCode(qrBox, { text: getJoinURL(), width: s, height: s, colorDark: "#111", colorLight: "#fff" });
          }
          startDisplayDustMotes();
          return;
        }

        if (game.phase === "finished") {
          const rankings = getRankings();
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(true)}
              <div class="disp-content">
                <div class="disp-final-title">🎉 最終排名</div>
                <div class="disp-rankings">
                  ${rankings.map((row, i) => `
                    <div class="disp-rank-row ${i === 0 ? "is-first" : ""}">
                      <span class="disp-rank-medal">${rankLabel(row.rank)}</span>
                      <span class="disp-rank-name">${escapeHTML(row.name)}</span>
                      <span class="disp-rank-score">${row.correct}<span class="disp-rank-unit"> 場</span></span>
                    </div>`).join("")}
                </div>
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        if (!round) {
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(false)}
              <div class="disp-content"><div class="disp-waiting-text">等待中...</div></div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        renderDisplayRound(round);
      }

      function renderDisplayRound(round) {
        if (round.status === "pending") {
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(false)}
              <div class="disp-content">
                <div class="disp-round-label">${escapeHTML(round.label)}</div>
                <div class="disp-versus-row">
                  <div class="disp-player-name disp-p1-name">${escapeHTML(round.p1)}</div>
                  <div class="disp-vs-text">vs</div>
                  <div class="disp-player-name disp-p2-name">${escapeHTML(round.p2)}</div>
                </div>
                <div class="disp-waiting-text">等待開放投票...</div>
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        if (round.status === "closed") {
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(true)}
              <div class="disp-winner-bg"></div>
              <div class="disp-content">
                <div class="disp-round-label">${escapeHTML(round.label)} — 結果揭曉</div>
                <div class="disp-trophy">🏆</div>
                <div class="disp-winner-name">${escapeHTML(round.winner)}</div>
                <div class="disp-winner-sub">獲得本場勝利</div>
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        // status === "open"
        const roundPredictions = getPredictionsForRound(round.id);
        const p1Votes = roundPredictions.filter(p => p.pick === round.p1).length;
        const p2Votes = roundPredictions.filter(p => p.pick === round.p2).length;
        const total = p1Votes + p2Votes;
        const p1Pct = total > 0 ? Math.round(p1Votes / total * 100) : 0;
        const p2Pct = total > 0 ? 100 - p1Pct : 0;

        app.innerHTML = `
          <div class="disp-root fade-in">
            ${dispBgHTML(false)}
            <div class="disp-content">
              <div class="disp-round-label">${escapeHTML(round.label)}</div>
              <div class="disp-vote-grid">
                <div class="disp-vote-card disp-vc-p1">
                  <div class="disp-vc-name">${escapeHTML(round.p1)}</div>
                  <div class="disp-vc-count">${p1Votes}</div>
                  <div class="disp-vc-bar-wrap">
                    <div class="disp-vc-bar disp-vc-bar-p1" style="width:${p1Pct}%"></div>
                  </div>
                  <div class="disp-vc-pct">${total > 0 ? p1Pct + "%" : "—"}</div>
                </div>
                <div class="disp-vote-vs-col">
                  <div class="disp-vs-pill">VS</div>
                  <div class="disp-voter-count">${roundPredictions.length} / ${participants.length} 人已投票</div>
                </div>
                <div class="disp-vote-card disp-vc-p2">
                  <div class="disp-vc-name">${escapeHTML(round.p2)}</div>
                  <div class="disp-vc-count">${p2Votes}</div>
                  <div class="disp-vc-bar-wrap">
                    <div class="disp-vc-bar disp-vc-bar-p2" style="width:${p2Pct}%"></div>
                  </div>
                  <div class="disp-vc-pct">${total > 0 ? p2Pct + "%" : "—"}</div>
                </div>
              </div>
            </div>
          </div>`;
        startDisplayDustMotes();
      }

      function renderHost() {
        participantMounted = false;
        app.style.background = "";
        if (dustRaf) { cancelAnimationFrame(dustRaf); dustRaf = null; }

        if (!hostAuthed) {
          hostMounted = false;
          app.innerHTML = `
            <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:radial-gradient(ellipse at 50% 10%, rgba(232,184,75,0.07), transparent 55%);">
              <form id="host-auth-form" class="fade-in" style="width:min(300px,100%);display:flex;flex-direction:column;align-items:center;gap:0;">

                <div style="font-family:'Noto Serif TC',serif;font-size:11px;letter-spacing:0.4em;color:var(--muted);margin-bottom:20px;">— 主持人入口 —</div>

                <div style="font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--gold);letter-spacing:0.06em;line-height:1.2;text-align:center;">你的杖，你的杆，都擊打我</div>

                <div style="width:32px;height:1px;background:var(--border);margin:28px 0;"></div>

                <input id="host-pass-input" type="password" placeholder="通行碼" autofocus
                  style="width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);border-radius:0;
                         text-align:center;font-size:20px;letter-spacing:0.25em;padding:10px 0;color:var(--text);
                         outline:none;transition:border-color 0.2s;"
                  onfocus="this.style.borderColor='var(--gold-dim)'"
                  onblur="this.style.borderColor='var(--border)'">

                <button type="submit"
                  style="margin-top:32px;width:100%;background:transparent;border:1px solid var(--border);border-radius:6px;
                         color:var(--muted);font-size:12px;letter-spacing:0.25em;padding:11px;
                         font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:border-color 0.2s,color 0.2s;"
                  onmouseover="this.style.borderColor='var(--gold-dim)';this.style.color='var(--gold)'"
                  onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--muted)'">
                  進　入
                </button>

              </form>
            </div>
          `;
          const input = document.getElementById("host-pass-input");
          if (input) input.focus();
          return;
        }

        if (!hostMounted) {
          hostMounted = true;
          gamePanelSignature = "";
          setupPanelSignature = "";
          app.innerHTML = `
            <div class="host-header">
              <div class="brand">你的杖，你的杆，都擊打我<small>盲眼劍客猜勝負</small></div>
              <button class="reset-btn" type="button" data-action="reset">重置</button>
            </div>
            <div class="tabs">
              ${TABS.map(([key, label]) => `<button class="tab-btn" type="button" data-tab="${key}">${label}</button>`).join("")}
            </div>
            <main class="host-main">
              ${TABS.map(([key]) => `<section id="host-panel-${key}" class="panel fade-in"></section>`).join("")}
            </main>
          `;
        }

        updateHostTabs();
        updateSetupPanel();
        updateGamePanel();
        updateDisplayPanel();
        updateRosterPanel();
        updateLeaderboardPanel();
      }

      function updateHostTabs() {
        document.querySelectorAll("[data-tab]").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.tab === hostTab);
        });
        TABS.forEach(([key]) => {
          const panel = document.getElementById(`host-panel-${key}`);
          if (panel) panel.classList.toggle("is-active", key === hostTab);
        });
      }

      function updateSetupPanel() {
        const panel = document.getElementById("host-panel-setup");
        if (!panel) return;

        const sig = `${game.phase}|${game.rounds.map(r => r.id + r.status).join(",")}|${editingRoundId}`;
        if (sig === setupPanelSignature) return;
        setupPanelSignature = sig;

        const isFinished = game.phase === "finished";
        const isSetup    = game.phase === "setup";

        panel.innerHTML = `
          <div class="stack">

            ${isSetup && game.rounds.length > 0 ? `
              <button class="btn primary full" type="button" data-action="start-game" style="font-size:16px;padding:14px;">
                ▶ 開始遊戲（${game.rounds.length} 場已就緒）
              </button>` : ""}

            <form id="round-form" class="card stack">
              <h2 class="section-title">＋ 新增比賽</h2>
              <input id="round-label" type="text" placeholder="比賽名稱（選填，例：第一場）"
                     ${isFinished ? "disabled" : ""}>
              <div class="form-row">
                <input id="round-p1" type="text" placeholder="選手 A ／左方"
                       ${isFinished ? "disabled" : ""}>
                <input id="round-p2" type="text" placeholder="選手 B ／右方"
                       ${isFinished ? "disabled" : ""}>
              </div>
              <button class="btn blue full" type="submit" ${isFinished ? "disabled" : ""}
                      style="font-size:15px;padding:12px;">
                ＋ 新增比賽
              </button>
              ${isFinished ? `<div class="hint" style="text-align:center;">遊戲已結束，無法新增</div>` : ""}
            </form>

            <div class="card stack">
              <div class="row">
                <h2 class="section-title" style="margin:0;">比賽列表（${game.rounds.length} 場）</h2>
              </div>
              ${game.rounds.length === 0
                ? `<div class="hint" style="padding:16px 0;text-align:center;">尚未新增比賽 ↑ 請在上方填寫後按新增</div>`
                : `<div class="stack">${game.rounds.map((round, idx) => {
                    const isEditing = editingRoundId === round.id;
                    const canEdit   = round.status === "pending";
                    const isCurrent = game.phase === "active" && idx === game.currentRoundIdx;
                    const statusTag = round.status === "closed"
                      ? `<span class="badge closed" style="font-size:11px;">✓ 結束・勝：${escapeHTML(round.winner || "")}</span>`
                      : isCurrent
                        ? `<span class="badge open" style="font-size:11px;">進行中</span>`
                        : round.status === "open"
                          ? `<span class="badge open" style="font-size:11px;">投票中</span>`
                          : `<span class="badge" style="font-size:11px;">待開始</span>`;
                    if (isEditing) {
                      return `
                        <form id="edit-round-form" data-round-id="${escapeHTML(round.id)}"
                              style="background:var(--surface);border:1px solid var(--gold-dim);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;">
                          <div class="hint" style="color:var(--gold);font-weight:700;">編輯比賽</div>
                          <input id="edit-label" type="text" value="${escapeHTML(round.label)}" placeholder="比賽名稱">
                          <div class="form-row">
                            <input id="edit-p1" type="text" value="${escapeHTML(round.p1)}" placeholder="選手 A">
                            <input id="edit-p2" type="text" value="${escapeHTML(round.p2)}" placeholder="選手 B">
                          </div>
                          <div class="form-row">
                            <button class="btn primary" type="submit">✓ 儲存</button>
                            <button class="btn ghost" type="button" data-action="cancel-edit">取消</button>
                          </div>
                        </form>`;
                    }
                    return `
                      <div class="round-item">
                        <div style="flex:1;min-width:0;">
                          <div class="round-name">${escapeHTML(round.label)}</div>
                          <div class="hint" style="margin-top:3px;">${escapeHTML(round.p1)} vs ${escapeHTML(round.p2)}</div>
                          <div style="margin-top:5px;">${statusTag}</div>
                        </div>
                        ${canEdit ? `
                        <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0;">
                          <button class="btn ghost" type="button" data-action="edit-round"
                                  data-round-id="${escapeHTML(round.id)}" style="font-size:12px;padding:4px 12px;">✏ 編輯</button>
                          <button class="btn red" type="button" data-action="remove-round"
                                  data-round-id="${escapeHTML(round.id)}" style="font-size:12px;padding:4px 12px;">✕ 刪除</button>
                        </div>` : ""}
                      </div>`;
                  }).join("")}</div>`}
            </div>
          </div>
        `;
      }

      function statusBadge(round) {
        if (!round) return "";
        if (round.status === "open") return `<span class="badge open"><span class="dot"></span>投票開放中</span>`;
        if (round.status === "closed") return `<span class="badge closed">勝者：${escapeHTML(round.winner || "")}</span>`;
        return `<span class="badge"><span class="dot pulse"></span>投票尚未開放</span>`;
      }

      function updateGamePanel() {
        const panel = document.getElementById("host-panel-game");
        if (!panel) return;

        const round = getCurrentRound();
        const signature = round && round.status === "open"
          ? `${game.phase}|${game.currentRoundIdx}|${round.id}|${round.status}`
          : `${game.phase}|${game.currentRoundIdx}|${round ? round.id : ""}|${round ? round.status : ""}|${round ? round.winner : ""}|${game.rounds.length}`;

        if (signature !== gamePanelSignature) {
          gamePanelSignature = signature;
          destroyVoteChart();

          const displayBtn = `<div style="text-align:right;margin-bottom:8px;"><button class="btn ghost" type="button" data-action="open-display" style="font-size:12px;letter-spacing:0.06em;">📺 開啟直播視窗</button></div>`;

          if (game.phase === "setup") {
            panel.innerHTML = `<div class="empty-state">請先到「場次」Tab 新增比賽，再按開始遊戲</div>`;
          } else if (game.phase === "finished") {
            panel.innerHTML = displayBtn + `<div class="empty-state">🏁 遊戲已結束，查看排名頁</div>${completedRoundsHTML()}`;
          } else if (!round) {
            panel.innerHTML = displayBtn + `<div class="empty-state">找不到目前場次，請重置後重新開始。</div>`;
          } else {
            const isLastRound = game.currentRoundIdx >= game.rounds.length - 1;
            panel.innerHTML = displayBtn + `
              <div class="stack">
                <div class="card current-round">
                  <h2>${escapeHTML(round.label)}</h2>
                  <div class="versus">${escapeHTML(round.p1)} <span>vs</span> ${escapeHTML(round.p2)}</div>
                  <div style="margin-top: 14px;">${statusBadge(round)}</div>
                </div>

                ${round.status === "pending" ? `
                  <button class="btn blue full" type="button" data-action="open-round" style="font-size:15px;padding:13px;">
                    🗳 開啟投票
                  </button>
                ` : ""}

                ${round.status === "open" ? `
                  <div class="card vote-chart-shell">
                    <div id="vote-count" class="hint" style="text-align:center;"></div>
                    <div id="vote-empty" class="empty-state" style="min-height:220px;">等待第一票...</div>
                    <div id="chart-frame" class="chart-frame" style="display:none;">
                      <canvas id="vote-chart"></canvas>
                    </div>
                  </div>
                  <div class="card stack">
                    <div class="hint" style="text-align:center;">標記本場勝者（投影畫面會自動顯示勝者）</div>
                    <div class="form-row">
                      <button class="btn primary" type="button" data-action="mark-winner" data-winner="${escapeHTML(round.p1)}" style="font-size:15px;padding:13px;">🏆 ${escapeHTML(round.p1)}</button>
                      <button class="btn red" type="button" data-action="mark-winner" data-winner="${escapeHTML(round.p2)}" style="font-size:15px;padding:13px;">🏆 ${escapeHTML(round.p2)}</button>
                    </div>
                  </div>
                ` : ""}

                ${round.status === "closed" ? `
                  <div class="card" style="text-align:center;border-color:var(--gold-dim);background:#171403;">
                    <div class="hint" style="margin-bottom:8px;">本場勝者</div>
                    <div style="font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--gold);">🏆 ${escapeHTML(round.winner)}</div>
                    <div class="hint" style="margin-top:8px;">投影畫面正在顯示勝者・參與者已看到預測結果</div>
                  </div>
                  <button class="btn ${isLastRound ? "gold" : "blue"} full" type="button" data-action="next-round" style="font-size:16px;padding:14px;">
                    ${isLastRound ? "🎉 公布最終排名" : "▶ 下一場"}
                  </button>
                ` : ""}

                <div id="completed-rounds">${completedRoundsHTML()}</div>
              </div>
            `;
          }
        }

        updateOpenRoundStats();
      }

      function completedRoundsHTML() {
        const completed = game.rounds.filter((round) => round.status === "closed");
        if (completed.length === 0) return "";
        return `
          <div class="card stack">
            <h2 class="section-title">已完成場次</h2>
            ${completed.map((round) => `
              <div class="finished-item">
                <div>
                  <div class="round-name">${escapeHTML(round.label)}</div>
                  <div class="hint">${escapeHTML(round.p1)} vs ${escapeHTML(round.p2)}</div>
                </div>
                <div class="score">勝者：${escapeHTML(round.winner || "")}</div>
              </div>
            `).join("")}
          </div>
        `;
      }

      function updateOpenRoundStats() {
        const round = getCurrentRound();
        if (!round || round.status !== "open") {
          destroyVoteChart();
          return;
        }

        const roundPredictions = getPredictionsForRound(round.id);
        const voteCount = document.getElementById("vote-count");
        if (voteCount) {
          voteCount.textContent = `${roundPredictions.length} / ${participants.length} 人已投票`;
        }

        if (hostTab !== "game") return;
        updateVoteChart(round, roundPredictions);
      }

      function updateVoteChart(round, roundPredictions) {
        const p1Votes = roundPredictions.filter((prediction) => prediction.pick === round.p1).length;
        const p2Votes = roundPredictions.filter((prediction) => prediction.pick === round.p2).length;
        const total = p1Votes + p2Votes;
        const empty = document.getElementById("vote-empty");
        const frame = document.getElementById("chart-frame");
        const canvas = document.getElementById("vote-chart");

        setVisible(empty, total === 0);
        setVisible(frame, total > 0);
        if (!canvas || total === 0) return;

        if (!voteChart || voteChartRoundId !== round.id || voteChart.canvas !== canvas) {
          voteChartRoundId = round.id;
          voteChart = new Chart(canvas, {
            type: "doughnut",
            data: {
              labels: [round.p1, round.p2],
              datasets: [{
                data: [p1Votes, p2Votes],
                backgroundColor: ["#e8b84b", "#c94040"],
                borderColor: "#14141f",
                borderWidth: 4
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              cutout: "58%",
              plugins: {
                legend: {
                  position: "bottom",
                  labels: { color: "#e8e4dc", font: { family: "Noto Sans TC", size: 13 } }
                },
                tooltip: {
                  backgroundColor: "#1a1a2a",
                  borderColor: "#1e1e2e",
                  borderWidth: 1,
                  titleFont: { family: "Noto Sans TC" },
                  bodyFont: { family: "Noto Sans TC" }
                }
              }
            }
          });
          return;
        }

        voteChart.data.labels = [round.p1, round.p2];
        voteChart.data.datasets[0].data = [p1Votes, p2Votes];
        voteChart.update();
      }

      function destroyVoteChart() {
        if (voteChart) {
          voteChart.destroy();
          voteChart = null;
          voteChartRoundId = "";
        }
      }

      function updateRosterPanel() {
        const panel = document.getElementById("host-panel-roster");
        if (!panel) return;

        const round = getCurrentRound();
        panel.innerHTML = `
          <div class="card stack">
            <div class="row">
              <h2 class="section-title" style="margin:0;">參與名單</h2>
              <div class="hint">${participants.length} 人</div>
            </div>
            ${participants.length === 0
              ? `<div class="hint">尚無參與者加入。</div>`
              : participants.map((person) => {
                  const voted = round && round.status === "open"
                    ? predictions.some((prediction) => prediction.name === person.name && prediction.roundId === round.id)
                    : false;
                  return `
                    <div class="person-item">
                      <div class="name">${escapeHTML(person.name)}</div>
                      ${round && round.status === "open"
                        ? `<div class="score">${voted ? "✓ 已投票" : "○ 待投票"}</div>`
                        : ""}
                    </div>
                  `;
                }).join("")}
          </div>
        `;
      }

      function updateLeaderboardPanel() {
        const panel = document.getElementById("host-panel-leaderboard");
        if (!panel) return;

        const rankings = getRankings();
        const total = closedRounds().length;
        panel.innerHTML = `
          <div class="card stack">
            <div class="row">
              <h2 class="section-title" style="margin:0;">排名</h2>
              <div class="hint">${game.phase === "finished" ? "最終排名" : "目前即時統計"} · 已結束 ${total} 場</div>
            </div>
            ${rankings.length === 0
              ? `<div class="hint">尚無參與者。</div>`

                    <div class="rank">${rankLabel(row.rank)}</div>

        const modeLabels = {

            <div class="card">

                <div>

                <button class="btn ${displayMode === "leaderboard" ? "gold" : "ghost"} full" type="button" data-action="disp-mode" data-mode="leaderboard"
                        style="padding:14px 8px;font-size:14px;">🏅<br><span style="font-size:11px;">即時排名</span></button>
                <button class="btn ${displayMode === "champion" ? "gold" : "ghost"} full" type="button" data-action="disp-mode" data-mode="champion"
                        style="padding:14px 8px;font-size:14px;">🎉<br><span style="font-size:11px;">公布冠軍</span></button>
              </div>

                : rankings.map(row => `
                  <button class="btn ${displayChampion === row.name ? "gold" : "ghost"} full" type="button"

                  </button>`).join("")}
            </div>

            <div class="card qr-card">

      function renderParticipant() {
        hostMounted = false;
        app.style.background = "";
        if (dustRaf) { cancelAnimationFrame(dustRaf); dustRaf = null; }
        destroyVoteChart();
        participantName = getNameParam();

        if (!participantName) {
          if (!participantMounted || !document.getElementById("join-name")) {
            participantMounted = true;
            app.innerHTML = `
              <div class="participant-page fade-in">
                <main class="participant-main">
                  <form id="join-form" class="card join-card stack">
                    <h1 style="font-size:22px;letter-spacing:0.04em;">你的杖，你的杆，都擊打我</h1>
                    <input id="join-name" type="text" placeholder="輸入你的名字" autocomplete="name" autofocus>
                    <button class="btn gold full" type="submit">加入 →</button>
                  </form>
                </main>
              </div>
            `;
            const input = document.getElementById("join-name");
            if (input) input.focus();
          }
          return;
        }

        participantMounted = true;
        const round = getCurrentRound();
        const myCorrect = correctCountFor(participantName);
        const totalClosed = closedRounds().length;

        app.innerHTML = `
          <div class="participant-page fade-in">
            <header class="participant-header">
              <div class="brand">你的杖，你的杆，都擊打我<small>${escapeHTML(participantName)}</small></div>
              <div class="score">${myCorrect}<span class="muted">/${totalClosed}</span></div>
            </header>
            <main class="participant-main">
              ${participantContent(round)}
            </main>
          </div>
        `;
      }

      function participantContent(round) {
        if (game.phase === "setup") {
          return `<div class="empty-state pulse">等待主持人開始遊戲...</div>`;
        }

        if (game.phase === "finished") {
          return participantFinishedHTML();
        }

        if (!round) {
          return `<div class="empty-state">等待下一場...</div>`;
        }

        const myPrediction = currentParticipantPrediction(round);

        if (round.status === "pending") {
          return `
            <div class="card current-round">
              <h2>${escapeHTML(round.label)}</h2>
              <div class="versus">${escapeHTML(round.p1)} <span>vs</span> ${escapeHTML(round.p2)}</div>
              <div class="hint pulse" style="margin-top:18px;">等待主持人開啟投票...</div>
            </div>
          `;
        }

        if (round.status === "open" && !myPrediction) {
          return `
            <div class="card stack">
              <div style="text-align:center;">
                <div class="hint">你覺得誰會贏？</div>
                <h2 class="participant-title">${escapeHTML(round.label)}</h2>
              </div>
              <div class="vote-options">
                <button class="btn vote-option vote-p1" type="button" data-action="vote" data-pick="${escapeHTML(round.p1)}">${escapeHTML(round.p1)}</button>
                <button class="btn red vote-option" type="button" data-action="vote" data-pick="${escapeHTML(round.p2)}">${escapeHTML(round.p2)}</button>
              </div>
            </div>
          `;
        }

        if (round.status === "open" && myPrediction) {
          return `
            <div class="card current-round">
              <div class="hint">已投給：</div>
              <h2>${escapeHTML(myPrediction.pick)}</h2>
              <div class="hint pulse">等待結果...</div>
            </div>
          `;
        }

        if (round.status === "closed") {
          const myPrediction = currentParticipantPrediction(round);
          const resultText = myPrediction
            ? (myPrediction.pick === round.winner ? "🎯 猜對了！" : "😅 猜錯了")
            : "📋 本場未投票";
          return `
            <div class="card current-round">
              <div class="participant-title">${resultText}</div>
              <div class="hint">本場勝者</div>
              <h2>${escapeHTML(round.winner || "")}</h2>
              <div class="hint pulse">等待下一場...</div>
            </div>
          `;
        }

        return `<div class="empty-state">等待更新...</div>`;
      }

      function participantFinishedHTML() {
        const rankings = getRankings();
        const me = rankings.find((row) => row.name === participantName);
        const total = game.rounds.length;
        const myCorrect = correctCountFor(participantName);
        return `
          <div class="stack">
            <div class="card">
              <div class="hint" style="text-align:center;">個人成績</div>
              <div class="score-big">${myCorrect}<span class="muted" style="font-size:24px;">/${total}</span></div>
              <div class="hint" style="text-align:center;">第 ${me ? me.rank : "-"} 名</div>
            </div>
            <div class="card stack">
              <h2 class="section-title">完整排名</h2>
              ${rankings.map((row) => `
                <div class="leader-item ${row.name === participantName ? "me" : ""}">
                  <div class="rank">${rankLabel(row.rank)}</div>
                  <div class="name" style="flex:1;">${escapeHTML(row.name)}</div>
                  <div class="score">${row.correct} 場</div>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      function renderQR(url, size) {
        const container = document.getElementById("qr-box");
        if (!container || typeof QRCode === "undefined") return;
        const signature = `${url}|${size}|${container.childElementCount}`;
        if (qrSignature === signature && container.childElementCount > 0) return;
        qrSignature = signature;
        container.innerHTML = "";
        new QRCode(container, {
          text: url,
          width: size,
          height: size,
          colorDark: "#111",
          colorLight: "#fff"
        });
      }

      function openQRWindow() {
        const joinURL = getJoinURL();
        const qrWindow = window.open("", "_blank", "width=420,height=520");
        if (!qrWindow) {
          alert("請在瀏覽器允許此頁面開啟彈出視窗後再試");
          return;
        }
        qrWindow.document.write(`
          <!doctype html>
          <html lang="zh-Hant">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>你的杖，你的杆，都擊打我 QR Code</title>
            <style>
              * { box-sizing: border-box; }
              body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 18px;
                padding: 24px;
                background: #fff;
                color: #111;
                font-family: sans-serif;
                text-align: center;
              }
              #qr { padding: 12px; border: 1px solid #eee; }
              h1 { margin: 0; font-size: 26px; }
              p { margin: 0; color: #555; overflow-wrap: anywhere; }
            </style>
          </head>
          <body>
            <h1 style="font-size:18px;">你的杖，你的杆，都擊打我</h1>
            <div id="qr"></div>
            <p>${escapeHTML(joinURL)}</p>
            <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script>
            <script>
              window.onload = function () {
                new QRCode(document.getElementById("qr"), {
                  text: ${JSON.stringify(joinURL)},
                  width: 280,
                  height: 280,
                  colorDark: "#111",
                  colorLight: "#fff"
                });
              };
            <\/script>
          </body>
          </html>
        `);
        qrWindow.document.close();
      }

      async function saveGame(nextGame) {
        await db.ref("/game").set({
          phase: nextGame.phase,
          currentRoundIdx: nextGame.currentRoundIdx,
          rounds: nextGame.rounds
        });
      }

      async function addRound() {
        if (game.phase === "finished") return;
        const labelInput = document.getElementById("round-label");
        const p1Input = document.getElementById("round-p1");
        const p2Input = document.getElementById("round-p2");
        const p1 = p1Input ? p1Input.value.trim() : "";
        const p2 = p2Input ? p2Input.value.trim() : "";
        if (!p1 || !p2) {
          alert("請填入選手 A 與選手 B");
          return;
        }

        const label = labelInput && labelInput.value.trim()
          ? labelInput.value.trim()
          : `第 ${game.rounds.length + 1} 場`;
        const round = {
          id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          label,
          p1,
          p2,
          status: "pending",
          winner: null
        };
        if (labelInput) labelInput.value = "";
        if (p1Input) p1Input.value = "";
        if (p2Input) p2Input.value = "";
        await saveGame({ ...game, rounds: [...game.rounds, round] });
      }

      async function removeRound(roundId) {
        const target = game.rounds.find(r => r.id === roundId);
        if (!target || target.status !== "pending") return;
        await saveGame({ ...game, rounds: game.rounds.filter((round) => round.id !== roundId) });
      }

      async function updateRound(roundId, label, p1, p2) {
        const target = game.rounds.find(r => r.id === roundId);
        if (!target || target.status !== "pending") return;
        if (!p1 || !p2) { alert("請填入選手 A 與選手 B"); return; }
        const rounds = game.rounds.map(r =>
          r.id === roundId ? { ...r, label: label || target.label, p1, p2 } : r
        );
        editingRoundId = null;
        setupPanelSignature = "";
        await saveGame({ ...game, rounds });
      }

      async function setDisplayMode(mode, championName = "") {
        displayMode = mode;
        displayChampion = championName;
        // 立即更新 UI，不等 Firebase 回應
        updateDisplayPanel();
        await db.ref("/display").set({ mode, championName });
      }

      async function startGame() {
        if (game.phase !== "setup" || game.rounds.length === 0) return;
        hostTab = "game";
        await db.ref("/game").update({ phase: "active", currentRoundIdx: 0 });
      }

      async function openRound() {
        const round = getCurrentRound();
        if (!round || round.status !== "pending") return;
        const rounds = game.rounds.map((item, index) => index === game.currentRoundIdx ? { ...item, status: "open" } : item);
        await saveGame({ ...game, rounds });
      }

      async function markWinner(winner) {
        const round = getCurrentRound();
        if (!round || round.status !== "open") return;
        // 只關閉這場，不立即推進 —— 讓勝者畫面顯示給所有人看
        const rounds = game.rounds.map((item, index) => (
          index === game.currentRoundIdx ? { ...item, status: "closed", winner } : item
        ));
        await saveGame({ ...game, rounds });
      }

      async function nextRound() {
        const round = getCurrentRound();
        if (!round || round.status !== "closed") return;
        const nextIdx = game.currentRoundIdx + 1;
        const phase = nextIdx >= game.rounds.length ? "finished" : "active";
        if (phase === "finished") hostTab = "leaderboard";
        await saveGame({ phase, currentRoundIdx: nextIdx, rounds: game.rounds });
      }

      async function resetGame() {
        destroyVoteChart();
        hostTab = "setup";
        editingRoundId = null;
        displayMode = "auto";
        displayChampion = "";
        await db.ref().update({
          game: null,
          participants: null,
          predictions: null,
          display: null
        });
      }

      async function joinParticipant() {
        const input = document.getElementById("join-name");
        const name = input ? input.value.trim() : "";
        if (!name) {
          alert("請輸入名字");
          return;
        }
        if (!firebaseKeyIsValid(name)) {
          alert("名字不能包含 . # $ / [ ]");
          return;
        }
        await db.ref(`/participants/${name}`).set({ name, joinedAt: Date.now() });
        participantName = name;
        pushNameToURL(name);
        renderParticipant();
      }

      async function vote(pick) {
        const round = getCurrentRound();
        if (!round || round.status !== "open" || !participantName) return;
        if (!firebaseKeyIsValid(participantName)) {
          alert("名字不能包含 . # $ / [ ]");
          return;
        }
        const payload = { name: participantName, roundId: round.id, pick };
        const key = predictionKey(participantName, round.id);
        predictions = predictions.filter((prediction) => !(prediction.name === participantName && prediction.roundId === round.id));
        predictions.push(payload);
        renderParticipant();
        await db.ref(`/predictions/${key}`).set(payload);
      }

      document.addEventListener("click", (event) => {
        const tabButton = event.target.closest("[data-tab]");
        if (tabButton) {
          hostTab = tabButton.dataset.tab;
          updateHostTabs();
          updateOpenRoundStats();
          return;
        }

        const actionButton = event.target.closest("[data-action]");
        if (!actionButton) return;
        const action = actionButton.dataset.action;

        if (action === "open-display") openDisplayWindow();
        if (action === "open-qr") openQRWindow();
        if (action === "remove-round") removeRound(actionButton.dataset.roundId);
        if (action === "edit-round") {
          editingRoundId = actionButton.dataset.roundId;
          setupPanelSignature = "";
          updateSetupPanel();
        }
        if (action === "cancel-edit") {
          editingRoundId = null;
          setupPanelSignature = "";
          updateSetupPanel();
        }
        if (action === "start-game") startGame();
        if (action === "open-round") openRound();
        if (action === "mark-winner") markWinner(actionButton.dataset.winner);
        if (action === "next-round") nextRound();
        if (action === "reset") resetGame();
        if (action === "vote") vote(actionButton.dataset.pick);
        if (action === "disp-mode") setDisplayMode(actionButton.dataset.mode, displayChampion);
        if (action === "disp-champion") setDisplayMode("champion", actionButton.dataset.name);
      });

      document.addEventListener("submit", (event) => {
        if (event.target.id === "host-auth-form") {
          event.preventDefault();
          const input = document.getElementById("host-pass-input");
          if (input && input.value === HOST_PASS) {
            hostAuthed = true;
            sessionStorage.setItem("host-auth", "1");
            render();
          } else {
            input.value = "";
            input.placeholder = "密碼錯誤，請再試";
            input.focus();
          }
        }
        if (event.target.id === "round-form") {
          event.preventDefault();
          addRound();
        }
        if (event.target.id === "edit-round-form") {
          event.preventDefault();
          const roundId = event.target.dataset.roundId;
          const label = document.getElementById("edit-label")?.value.trim();
          const p1 = document.getElementById("edit-p1")?.value.trim();
          const p2 = document.getElementById("edit-p2")?.value.trim();
          updateRound(roundId, label, p1, p2);
        }
        if (event.target.id === "join-form") {
          event.preventDefault();
          joinParticipant();
        }
      });

      window.addEventListener("popstate", () => {
        participantName = getNameParam();
        hostMounted = false;
        participantMounted = false;
        render();
      });

      if (!isFirebaseConfigured()) {
        banner.classList.add("is-visible");
        app.innerHTML = "";
        return;
      }

      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.database();

      db.ref("/game").on("value", (snap) => {
        game = normalizeGame(snap.val());
        render();
      });

      db.ref("/participants").on("value", (snap) => {
        const value = snap.val() || {};
        participants = Object.values(value).filter(Boolean).sort((a, b) => {
          const timeDiff = (a.joinedAt || 0) - (b.joinedAt || 0);
          return timeDiff || String(a.name).localeCompare(String(b.name), "zh-Hant");
        });
        render();
      });

      db.ref("/predictions").on("value", (snap) => {
        const value = snap.val() || {};
        predictions = Object.values(value).filter(Boolean);
        render();
      });

      db.ref("/display").on("value", (snap) => {
        const val = snap.val() || {};
        displayMode = val.mode || "auto";
        displayChampion = val.championName || "";
        render();
      });
    })();
  </script>
</body>
</html>
