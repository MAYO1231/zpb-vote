  <style>
    :root {
      --bg: #080810; --surface: #0f0f1c; --card: #14141f; --border: #1e1e2e;
      --gold: #e8b84b; --gold-dim: #a07a1a;
      --red: #c94040; --green: #2d7a4a;
      --text: #e8e4dc; --muted: #5a5870; --dim: #2e2c3f;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    @keyframes goldPulse {
      0%, 100% { text-shadow: 0 0 40px rgba(232,184,75,0.35), 0 0 80px rgba(232,184,75,0.15); }
      50%       { text-shadow: 0 0 70px rgba(232,184,75,0.65), 0 0 130px rgba(232,184,75,0.3); }
    }

    @keyframes trophyFloat {
      0%, 100% { transform: translateY(0);   filter: drop-shadow(0 0 24px rgba(232,184,75,0.45)); }
      50%       { transform: translateY(-8px); filter: drop-shadow(0 0 44px rgba(232,184,75,0.75)); }
    }

    @keyframes glowIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans TC", sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    button, input {
      font: inherit;
    }

    button {
      min-height: 42px;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b0b15;
      color: var(--text);
      padding: 12px 13px;
      outline: none;
    }

    input:focus {
      border-color: var(--gold-dim);
    }

    .fade-in { animation: fadeIn 0.3s ease forwards; }
    .pulse { animation: pulse 2s ease-in-out infinite; }

    .banner {
      display: none;
      width: 100%;
      background: #5a1616;
      color: #ffe4e4;
      border-bottom: 1px solid #8f2828;
      padding: 12px 18px;
      text-align: center;
      font-weight: 700;
    }

    .banner.is-visible { display: block; }

    .app-shell {
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 75% 0%,   rgba(232,184,75,0.10) 0%, transparent 45%),
        radial-gradient(ellipse at 10% 100%, rgba(201,64,64,0.05)  0%, transparent 35%),
        radial-gradient(circle  at 15% 0%,   rgba(232,184,75,0.05), transparent 28%),
        linear-gradient(180deg, #080810 0%, #0b0b14 100%);
    }

    .host-header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      background: rgba(15, 15, 28, 0.95);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .brand {
      min-width: 0;
      font-family: "Noto Serif TC", serif;
      font-weight: 900;
      color: var(--gold);
      letter-spacing: 0;
      line-height: 1.1;
    }

    .brand small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-family: "Noto Sans TC", sans-serif;
      font-size: 12px;
      font-weight: 500;
    }

    .reset-btn {
      flex: 0 0 auto;
      border: 1px solid #4a1515;
      border-radius: 8px;
      background: transparent;
      color: #e47979;
      padding: 7px 11px;
      min-height: 34px;
      font-size: 13px;
      font-weight: 700;
    }

    .tabs {
      position: sticky;
      top: 64px;
      z-index: 4;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      background: rgba(15, 15, 28, 0.95);
      border-bottom: 1px solid var(--border);
    }

    .tab-btn {
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--muted);
      padding: 12px 6px;
      font-size: 14px;
      font-weight: 700;
    }

    .tab-btn.is-active {
      color: var(--gold);
      box-shadow: inset 0 -2px 0 var(--gold);
    }

    .host-main {
      width: min(980px, 100%);
      margin: 0 auto;
      padding: 18px;
    }

    .panel { display: none; }
    .panel.is-active { display: block; }

    .stack {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
    }

    .card.gold-border,
    .leader-item.gold-border {
      border-color: var(--gold-dim);
      background: #171403;
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--gold);
      font-family: "Noto Serif TC", serif;
      font-size: 19px;
      font-weight: 900;
    }

    .muted {
      color: var(--muted);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 13px;
      color: var(--text);
      background: var(--dim);
      font-weight: 700;
    }

    .btn.primary {
      background: #1a3d1a;
      border-color: #2a6a2a;
      color: #8ce08c;
    }

    .btn.blue {
      background: #17263f;
      border-color: #284a7a;
      color: #91bfff;
    }

    .btn.red {
      background: #3d1a1a;
      border-color: #6a2a2a;
      color: #e89898;
    }

    .btn.vote-p1 {
      background: #151d30;
      border-color: var(--gold);
      border-width: 2px;
    }

    .btn.gold {
      background: var(--gold);
      border-color: var(--gold);
      color: #0a0a10;
    }

    .btn.ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn.full { width: 100%; }

    .qr-card {
      text-align: center;
    }

    .qr-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 220px;
      min-height: 220px;
      padding: 10px;
      background: #fff;
      border-radius: 8px;
    }

    .round-item,
    .person-item,
    .leader-item,
    .finished-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .round-name {
      color: var(--gold);
      font-weight: 900;
      font-family: "Noto Serif TC", serif;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 10px;
      background: var(--dim);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .badge.open {
      background: #17351f;
      color: #83d996;
    }

    .badge.closed {
      background: #342a10;
      color: var(--gold);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .current-round {
      text-align: center;
      padding: 22px 16px;
    }

    .current-round h2,
    .participant-title {
      margin: 0 0 12px;
      color: var(--gold);
      font-family: "Noto Serif TC", serif;
      font-size: 24px;
      font-weight: 900;
    }

    .versus {
      font-size: clamp(22px, 5vw, 34px);
      font-weight: 900;
      line-height: 1.25;
    }

    .versus span {
      color: var(--muted);
      font-size: 0.56em;
      font-weight: 700;
      margin: 0 8px;
    }

    .vote-chart-shell {
      min-height: 285px;
    }

    .chart-frame {
      position: relative;
      width: min(360px, 100%);
      height: 240px;
      margin: 8px auto 0;
    }

    .empty-state {
      display: flex;
      min-height: 180px;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      text-align: center;
      color: var(--muted);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .participant-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .participant-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .participant-main {
      width: min(620px, 100%);
      margin: 0 auto;
      padding: 28px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .join-card {
      width: min(420px, calc(100vw - 36px));
      margin: auto;
    }

    .join-card h1 {
      margin: 0 0 20px;
      color: var(--gold);
      font-family: "Noto Serif TC", serif;
      font-size: 34px;
      font-weight: 900;
      text-align: center;
    }

    .vote-options {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .vote-option {
      width: 100%;
      min-height: 100px;
      border-radius: 14px;
      font-size: 26px;
      font-weight: 900;
      word-break: break-word;
      font-family: "Noto Serif TC", serif;
      letter-spacing: 0.04em;
      transition: transform 0.15s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .btn.vote-p1:hover {
      background: #1c2d48;
      box-shadow: 0 0 28px rgba(232,184,75,0.22), 0 4px 16px rgba(0,0,0,0.4);
    }

    .btn.red.vote-option:hover {
      background: #4a1f1f;
      box-shadow: 0 0 28px rgba(201,64,64,0.22), 0 4px 16px rgba(0,0,0,0.4);
    }

    .score-big {
      color: var(--gold);
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      text-align: center;
    }

    .leader-item.me {
      border-color: var(--gold-dim);
      background: #171403;
    }

    .rank {
      width: 42px;
      flex: 0 0 42px;
      color: var(--gold);
      font-weight: 900;
    }

    .name {
      min-width: 0;
      overflow-wrap: anywhere;
      font-weight: 700;
    }

    .score {
      flex: 0 0 auto;
      color: var(--gold);
      font-weight: 900;
    }

    /* ══════════════════════════════════════════════════════════════
       DISPLAY / PROJECTION MODE — 殿堂光柱
    ══════════════════════════════════════════════════════════════ */

    /* Cathedral fixed background */
    .disp-bg {
      position: fixed; inset: 0; overflow: hidden; z-index: 0;
      background: radial-gradient(ellipse 90% 60% at 50% -10%, #2a1e08 0%, #0a0810 55%, #060508 100%);
    }
    .cath-arch {
      position: absolute; left: 50%; top: 0; transform: translateX(-50%);
      width: min(1600px, 100%); height: 55%;
      background: radial-gradient(ellipse 70% 100% at 50% 0%, rgba(200,155,50,0.18) 0%, transparent 70%);
      pointer-events: none;
    }
    .cath-rays { position: absolute; inset: 0; opacity: 0.7; transition: opacity 1.5s ease; }
    .cath-rays.is-intense { opacity: 1; }
    .cath-ray { position: absolute; top: 0; transform-origin: 50% 0%; border-radius: 0 0 200px 200px; }
    .cath-ray-1 { left: 10%; width: 6vw;  height: 85vh; background: linear-gradient(180deg, rgba(230,185,80,0.20) 0%, transparent 100%); transform: rotate(-32deg); filter: blur(3px); animation: cathBreath 9s  ease-in-out infinite; }
    .cath-ray-2 { left: 28%; width: 7vw;  height: 80vh; background: linear-gradient(180deg, rgba(255,210,100,0.26) 0%, transparent 100%); transform: rotate(-14deg); filter: blur(2px); animation: cathBreath 11s ease-in-out infinite 1.3s; }
    .cath-ray-3 { left: 47%; width: 7vw;  height: 76vh; background: linear-gradient(180deg, rgba(255,215,110,0.30) 0%, transparent 100%); transform: rotate(2deg);   filter: blur(2px); animation: cathBreath 8s  ease-in-out infinite 0.6s; }
    .cath-ray-4 { left: 64%; width: 6vw;  height: 72vh; background: linear-gradient(180deg, rgba(220,170,60,0.20) 0%, transparent 100%); transform: rotate(18deg);  filter: blur(3px); animation: cathBreath 13s ease-in-out infinite 2.4s; }
    .cath-ray-5 { left: 78%; width: 5vw;  height: 65vh; background: linear-gradient(180deg, rgba(230,185,80,0.15) 0%, transparent 100%); transform: rotate(34deg);  filter: blur(4px); animation: cathBreath 10s ease-in-out infinite 3.8s; }
    @keyframes cathBreath { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
    .cath-floor {
      position: absolute; bottom: 0; left: 0; right: 0; height: 35%;
      background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(200,155,50,0.12) 0%, transparent 70%);
    }
    .cath-vignette {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%, transparent 40%, rgba(0,0,0,0.72) 100%);
    }
    .disp-dust {
      position: absolute; inset: 0; width: 100%; height: 100%;
      display: block; pointer-events: none;
    }

    /* Display root layout */
    .disp-root {
      position: relative; min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: clamp(24px,4vh,60px) clamp(20px,5vw,80px);
      text-align: center; gap: clamp(10px,2vh,24px);
    }
    .disp-content {
      position: relative; z-index: 5;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: clamp(10px,2vh,28px); width: 100%;
    }
    .disp-verse {
      position: fixed; bottom: clamp(14px,2.5vh,36px); left: 0; right: 0; z-index: 6;
      text-align: center; pointer-events: none;
      font-family: "Noto Serif TC", serif; font-size: clamp(12px,1.4vw,20px);
      font-weight: 700; letter-spacing: 0.24em; color: rgba(240,200,80,0.25);
    }

    /* shared display elements */
    .disp-round-label {
      font-size: clamp(13px,1.8vw,26px); font-weight: 500;
      letter-spacing: 0.28em; color: rgba(240,200,80,0.55);
    }
    .disp-main-title {
      font-family: "Noto Serif TC", serif; font-size: clamp(48px,9vw,120px);
      font-weight: 900; line-height: 1.05; letter-spacing: 0.06em; color: #f0c96e;
      text-shadow: 0 0 60px rgba(240,200,80,0.4), 0 0 120px rgba(240,200,80,0.2);
    }
    .disp-subtitle {
      font-size: clamp(24px,4vw,64px); font-weight: 700;
      letter-spacing: 0.18em; color: rgba(240,200,80,0.52);
    }
    .disp-divider {
      width: 60px; height: 1px; margin: clamp(6px,1.2vh,18px) auto;
      background: linear-gradient(90deg, transparent, rgba(240,200,80,0.5), transparent);
    }
    .disp-join-label {
      font-size: clamp(13px,1.8vw,26px); letter-spacing: 0.2em;
      font-weight: 500; color: rgba(240,200,80,0.65);
    }
    .disp-qr-wrap {
      background: #fff; padding: clamp(8px,1vw,14px); border-radius: 10px;
      box-shadow: 0 0 60px rgba(240,200,80,0.35), 0 0 120px rgba(240,200,80,0.15);
      display: inline-block; font-size: 0; line-height: 0;
    }
    .disp-join-url {
      font-size: clamp(10px,1.1vw,16px); color: rgba(240,200,80,0.28); letter-spacing: 0.08em;
    }
    .disp-waiting-text {
      font-size: clamp(13px,1.8vw,22px); letter-spacing: 0.14em;
      color: rgba(200,200,220,0.38); animation: pulse 2.4s ease-in-out infinite;
    }

    /* pending vs row */
    .disp-versus-row {
      display: flex; align-items: center; justify-content: center;
      gap: clamp(16px,4vw,80px); width: 100%;
    }
    .disp-player-name {
      font-family: "Noto Serif TC", serif; font-size: clamp(36px,7vw,100px);
      font-weight: 900; line-height: 1.1; flex: 1; max-width: clamp(260px,40vw,600px);
    }
    .disp-p1-name { color: #f0c96e; text-shadow: 0 0 40px rgba(240,200,80,0.35); }
    .disp-p2-name { color: #e07060; text-shadow: 0 0 40px rgba(220,100,80,0.35); }
    .disp-vs-text {
      font-family: "Noto Serif TC", serif; font-size: clamp(18px,2.5vw,40px);
      font-weight: 700; color: rgba(200,200,220,0.28); letter-spacing: 0.1em;
    }

    /* voting progress bar */
    .disp-bar-track {
      width: 100%; max-width: min(1200px,94vw);
      height: clamp(22px,4vh,56px); border-radius: clamp(6px,0.8vw,14px);
      background: rgba(255,255,255,0.05); overflow: hidden; display: flex;
    }
    .disp-bar-p1-fill {
      height: 100%;
      background: linear-gradient(90deg, #c8a438, #f0c96e);
      box-shadow: 6px 0 32px rgba(240,200,80,0.65);
      transition: width 1s cubic-bezier(0.34,1.1,0.64,1);
      border-radius: clamp(6px,0.8vw,14px) 0 0 clamp(6px,0.8vw,14px);
    }
    .disp-bar-p2-fill {
      flex: 1; height: 100%;
      background: linear-gradient(90deg, #c94040, #e07060);
      box-shadow: -6px 0 32px rgba(220,100,80,0.65);
      border-radius: 0 clamp(6px,0.8vw,14px) clamp(6px,0.8vw,14px) 0;
    }
    .disp-bar-track.no-votes .disp-bar-p1-fill,
    .disp-bar-track.no-votes .disp-bar-p2-fill {
      background: rgba(255,255,255,0.1); box-shadow: none;
    }
    .disp-stats-row {
      display: flex; align-items: baseline; justify-content: space-between;
      width: 100%; max-width: min(1200px,94vw);
      gap: clamp(8px,2vw,24px);
    }
    .disp-stat {
      font-size: clamp(13px,1.8vw,28px); font-weight: 700;
      letter-spacing: 0.05em; flex: 1;
    }
    .disp-stat-p1 { color: #f0c96e; }
    .disp-stat-p2 { color: #e07060; text-align: right; }
    .disp-stat-center {
      font-size: clamp(11px,1.2vw,18px); color: rgba(200,200,220,0.38);
      letter-spacing: 0.08em; text-align: center; flex-shrink: 0;
    }

    /* winner */
    .disp-trophy {
      font-size: clamp(64px,13vw,150px); line-height: 1;
      animation: trophyFloat 2.8s ease-in-out infinite;
    }
    .disp-winner-name {
      font-family: "Noto Serif TC", serif; font-size: clamp(50px,10.5vw,125px);
      font-weight: 900; color: #f0c96e; line-height: 1.1; word-break: break-word;
      animation: goldPulse 2.8s ease-in-out infinite, glowIn 0.6s ease forwards;
    }
    .disp-winner-sub {
      font-size: clamp(13px,1.8vw,26px); color: rgba(200,200,220,0.42); letter-spacing: 0.24em;
    }
    .disp-winner-bg {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: radial-gradient(ellipse at 50% 35%, rgba(240,200,80,0.14), transparent 60%);
      animation: pulse 3s ease-in-out infinite;
    }

    /* finals */
    .disp-final-title {
      font-family: "Noto Serif TC", serif; font-size: clamp(22px,3.8vw,52px);
      font-weight: 900; color: #f0c96e; letter-spacing: 0.1em;
    }
    .disp-rankings {
      display: flex; flex-direction: column; gap: clamp(5px,1vh,12px);
      width: 100%; max-width: min(680px,90vw);
    }
    .disp-rank-row {
      display: flex; align-items: center; gap: clamp(10px,2vw,26px);
      padding: clamp(9px,1.4vh,20px) clamp(10px,1.8vw,30px);
      border-radius: clamp(7px,1vw,13px);
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    }
    .disp-rank-row.is-first { border-color: rgba(240,200,80,0.5); background: rgba(240,200,80,0.06); }
    .disp-rank-medal { font-size: clamp(20px,2.8vw,38px); min-width: clamp(30px,3.5vw,50px); }
    .disp-rank-name  { flex: 1; font-family: "Noto Serif TC",serif; font-size: clamp(17px,2.4vw,36px); font-weight: 700; text-align: left; }
    .disp-rank-score { font-family: "Noto Serif TC",serif; font-size: clamp(24px,3.2vw,48px); font-weight: 900; color: #f0c96e; }
    .disp-rank-unit  { font-size: 0.55em; color: rgba(200,200,220,0.42); }

    @media (max-width: 720px) {
      .grid,
      .form-row {
        grid-template-columns: 1fr;
      }

      .host-header {
        align-items: flex-start;
      }

      .tabs {
        top: 62px;
      }

      .tab-btn {
        font-size: 13px;
        padding-inline: 2px;
      }

      .host-main {
        padding: 14px;
      }

      .row {
        align-items: flex-start;
        flex-direction: column;
      }

      .row .btn {
        width: 100%;
      }
    }

    /* ── Text Vote ────────────────────────────────────────────────── */
    .text-vote-group {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 12px; display: flex; align-items: center; gap: 8px;
    }
    .text-vote-group.top { border-color: var(--gold-dim); }
    .tv-rank { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
    .tv-name { font-size: 15px; font-weight: 700; color: var(--text); }
    .tv-variants { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .tv-count { font-size: 20px; font-weight: 900; color: var(--gold); min-width: 32px; text-align: right; }
    .tv-bar { height: 4px; background: var(--gold); border-radius: 2px; opacity: 0.7; transition: width 0.4s ease; margin-top: 4px; }
    .nom-card { border-color: rgba(232,184,75,0.25) !important; }
    .nom-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
    /* ── Display nomination ─────────────────────────────────────── */
    .disp-nom-title {
      font-size: clamp(20px, 3vw, 36px); color: var(--gold);
      font-family: 'Noto Serif TC', serif; font-weight: 900;
      text-align: center; margin-bottom: 28px;
    }
    .disp-nom-list { display: flex; flex-direction: column; gap: 10px; max-width: 700px; width: 100%; }
    .disp-nom-row {
      display: flex; align-items: center; gap: 16px;
      padding: 10px 20px; background: rgba(255,255,255,0.04);
      border-radius: 10px; border: 1px solid rgba(232,184,75,0.15);
    }
    .disp-nom-row.is-top { border-color: rgba(232,184,75,0.5); background: rgba(232,184,75,0.07); }
    .disp-nom-medal { font-size: 22px; width: 30px; text-align: center; }
    .disp-nom-name-wrap { flex: 1; min-width: 0; }
    .disp-nom-name { font-size: clamp(18px, 2.5vw, 28px); font-weight: 700; color: var(--text); }
    .disp-nom-bar-wrap { height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 4px; }
    .disp-nom-bar-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width 0.5s ease; }
    .disp-nom-count { font-size: clamp(20px, 3vw, 36px); font-weight: 900; color: var(--gold); }
    .disp-nom-unit { font-size: 14px; color: var(--muted); margin-left: 3px; }

    /* ── Word cloud (即時文字雲) ─────────────────────────────────── */
    .disp-cloud {
      position: relative; width: 100%; height: 62vh;
      max-width: 1180px; overflow: hidden;
    }
    .disp-cloud-word {
      position: absolute;
      font-family: 'Noto Serif TC', serif; line-height: 1.1;
      white-space: nowrap; cursor: default;
      text-shadow: 0 2px 22px rgba(0,0,0,0.55);
      transition: left .55s cubic-bezier(.25,.46,.45,.94),
                  top  .55s cubic-bezier(.25,.46,.45,.94),
                  font-size .7s cubic-bezier(.34,1.56,.64,1),
                  color .6s ease, font-weight .6s ease, opacity .45s ease;
    }
    .disp-cloud-word.is-top { text-shadow: 0 0 26px rgba(232,184,75,0.45), 0 2px 22px rgba(0,0,0,0.55); }
    .disp-cloud-word.pop { animation: cloudPop .6s cubic-bezier(.34,1.56,.64,1) forwards; }
    .disp-cloud-word.leaving { opacity: 0 !important; pointer-events: none; }
    @keyframes cloudPop {
      from { transform: scale(0.15); opacity: 0; }
      to   { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div id="config-banner" class="banner">⚠️ 請先填入 Firebase 設定</div>
  <div id="app" class="app-shell"></div>

  <script>
    (() => {
      const DEFAULT_GAME = { phase: "setup", currentRoundIdx: 0, rounds: [] };
      const TABS = [
        ["setup", "場次"],
        ["game", "遊戲"],
        ["roster", "名單"],
        ["leaderboard", "排名"]
      ];

      const HOST_PASS = "594131";
      let hostAuthed = sessionStorage.getItem("host-auth") === "1";

      let db = null;
      let game = DEFAULT_GAME;
      let participants = [];
      let predictions = [];
      let hostTab = "setup";
      let hostMounted = false;
      let participantMounted = false;
      let participantName = getNameParam();
      let gamePanelSignature = "";
      let setupPanelSignature = "";
      let voteChart = null;
      let voteChartRoundId = "";
      let qrSignature = "";
      let dustRaf = null;
      let textVoteData = null;
      let textVoteEntries = {};
      let textVoteGroups = [];
      let openAiKey = localStorage.getItem('openai_key') || '';
      let participantView = 'game';   // 'game' | 'nom'
      let displayMode = "auto";   // "auto" | "qr" | "current" | "leaderboard" | "champion" | "textVote"
      let displayChampion = "";
      let editingRoundId = null;
      let editingTemplateId = null;

      const app = document.getElementById("app");
      const banner = document.getElementById("config-banner");
      let templates = [];   // 從 Firebase /templates 同步

      function loadTemplates() { return templates; }   // 保持呼叫相容

      async function saveCurrentAsTemplate(name) {
        if (game.rounds.length === 0) { alert("目前沒有比賽可儲存"); return; }
        const id = `t_${Date.now()}`;
        await db.ref(`/templates/${id}`).set({
          id,
          name: name || `範本 ${templates.length + 1}`,
          createdAt: Date.now(),
          rounds: game.rounds.map(r => ({ label: r.label, p1: r.p1, p2: r.p2 }))
        });
      }

      async function deleteTemplate(id) {
        await db.ref(`/templates/${id}`).remove();
      }

      async function renameTemplate(id, newName) {
        if (!newName) return;
        await db.ref(`/templates/${id}/name`).set(newName);
        editingTemplateId = null;
        setupPanelSignature = "";
        updateSetupPanel();
      }

      async function applyTemplate(id) {
        const tpl = templates.find(t => t.id === id);
        if (!tpl) return;
        if (game.rounds.length > 0 &&
            !confirm(`載入「${tpl.name}」後，目前 ${game.rounds.length} 場比賽將被取代，確定嗎？`)) return;
        const rounds = tpl.rounds.map(r => ({
          id: `r_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`,
          label: r.label, p1: r.p1, p2: r.p2,
          status: "pending", winner: null
        }));
        await saveGame({ phase: "setup", currentRoundIdx: 0, rounds });
      }

      function getMode() {
        return new URLSearchParams(location.search).get("mode");
      }

      function getNameParam() {
        const n = new URLSearchParams(location.search).get("name");
        return n ? decodeURIComponent(n) : "";
      }

      function pushNameToURL(name) {
        const url = new URL(location.href);
        url.searchParams.set("mode", "join");
        url.searchParams.set("name", encodeURIComponent(name));
        history.pushState({}, "", url.toString());
      }

      function isFirebaseConfigured() {
        return FIREBASE_CONFIG &&
          typeof FIREBASE_CONFIG.databaseURL === "string" &&
          FIREBASE_CONFIG.databaseURL.length > 0 &&
          !FIREBASE_CONFIG.databaseURL.includes("YOUR_PROJECT");
      }

      function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[ch]);
      }

      function firebaseKeyIsValid(value) {
        return value && !/[.#$/\[\]]/.test(value);
      }

      function normalizeRounds(rawRounds) {
        if (Array.isArray(rawRounds)) {
          return rawRounds.filter(Boolean);
        }
        if (rawRounds && typeof rawRounds === "object") {
          return Object.keys(rawRounds)
            .sort((a, b) => Number(a) - Number(b))
            .map((key) => rawRounds[key])
            .filter(Boolean);
        }
        return [];
      }

      function normalizeGame(rawGame) {
        if (!rawGame || typeof rawGame !== "object") {
          return { ...DEFAULT_GAME, rounds: [] };
        }
        return {
          phase: rawGame.phase || "setup",
          currentRoundIdx: Number(rawGame.currentRoundIdx) || 0,
          rounds: normalizeRounds(rawGame.rounds).map((round) => ({
            id: round.id,
            label: round.label,
            p1: round.p1,
            p2: round.p2,
            status: round.status || "pending",
            winner: round.winner ?? null
          }))
        };
      }

      function getCurrentRound() {
        if (game.phase !== "active") return null;
        if (game.currentRoundIdx < 0 || game.currentRoundIdx >= game.rounds.length) return null;
        return game.rounds[game.currentRoundIdx];
      }

      function getPredictionsForRound(roundId) {
        return predictions.filter((prediction) => prediction.roundId === roundId);
      }

      function predictionKey(name, roundId) {
        return `${name}_${roundId}`;
      }

      function currentParticipantPrediction(round) {
        if (!participantName || !round) return null;
        return predictions.find((prediction) => prediction.name === participantName && prediction.roundId === round.id) || null;
      }

      function closedRounds() {
        return game.rounds.filter((round) => round.status === "closed" && round.winner);
      }

      function correctCountFor(name) {
        return predictions.filter((prediction) => {
          if (prediction.name !== name) return false;
          const round = game.rounds.find((item) => item.id === prediction.roundId);
          return round && round.status === "closed" && round.winner === prediction.pick;
        }).length;
      }

      function getRankings() {
        const rows = participants.map((person) => ({
          name: person.name,
          correct: correctCountFor(person.name)
        })).sort((a, b) => {
          if (b.correct !== a.correct) return b.correct - a.correct;
          return a.name.localeCompare(b.name, "zh-Hant");
        });

        let lastScore = null;
        let lastRank = 0;
        rows.forEach((row, index) => {
          if (row.correct !== lastScore) {
            lastRank = index + 1;
            lastScore = row.correct;
          }
          row.rank = lastRank;
        });
        return rows;
      }

      function rankLabel(rank) {
        if (rank === 1) return "🥇";
        if (rank === 2) return "🥈";
        if (rank === 3) return "🥉";
        return String(rank);
      }

      function getJoinURL() {
        const url = new URL(location.href);
        url.searchParams.set("mode", "join");
        url.searchParams.delete("name");
        return url.toString();
      }

      function setVisible(element, visible) {
        if (!element) return;
        element.style.display = visible ? "" : "none";
      }

      // ── Text Vote utilities ──────────────────────────────────────
      function localGroupEntries(entries) {
        const counts = {};
        for (const e of entries) {
          const t = (e.text || '').trim();
          if (!t) continue;
          counts[t] = (counts[t] || 0) + 1;
        }
        return Object.entries(counts).map(([text, count]) => ({ canonical: text, variants: [text], count }));
      }

      function applyMerges(rawGroups, merges) {
        if (!merges || !Object.keys(merges).length) return rawGroups;
        const textToCanonical = {};
        for (const [canonical, variants] of Object.entries(merges)) {
          for (const v of (variants || [])) textToCanonical[v] = canonical;
        }
        const result = {};
        for (const g of rawGroups) {
          const mapped = textToCanonical[g.canonical] || g.canonical;
          if (!result[mapped]) result[mapped] = { canonical: mapped, variants: [], count: 0 };
          result[mapped].count += g.count;
          for (const v of g.variants) {
            if (!result[mapped].variants.includes(v)) result[mapped].variants.push(v);
          }
        }
        return Object.values(result).sort((a, b) => b.count - a.count);
      }

      function computeTextVoteGroups() {
        const entries = Object.values(textVoteEntries).filter(e => e && e.text);
        const rawGroups = localGroupEntries(entries);
        const merges = textVoteData && textVoteData.merges ? textVoteData.merges : {};
        textVoteGroups = applyMerges(rawGroups, merges).sort((a, b) => b.count - a.count);
      }

      // ── Word cloud (即時文字雲) ──────────────────────────────────
      const CLOUD_PALETTE = ['#e8b84b', '#d98c8c', '#7bbf97', '#e8e4dc', '#c9a84b', '#cdb86a'];
      function cloudHash(str) {
        let h = 0;
        for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
        return h;
      }
      // 依票數比例算字級／顏色／粗細，build 與 in-place update 共用，確保一致
      // n = 不同人選數量：人少時整體偏大，人越多最小越小、最大越大（拉開差距）
      function cloudStyleFor(count, minC, maxC, canonical, isTop, n) {
        const denom = maxC - minC;
        let t = denom > 0 ? (count - minC) / denom : 1;
        t = Math.sqrt(Math.max(0, Math.min(1, t)));   // sqrt easing，差距更柔和
        const maxSize = Math.min(5.5 + n * 0.12, 9);   // rem：人越多上限越大（封頂 9）
        const minSize = Math.max(4.5 - n * 0.28, 1.2); // rem：人越多下限越小（地板 1.2）
        const size = (minSize + t * (maxSize - minSize)).toFixed(2);
        const weight = 400 + Math.round(t * 500);      // 400 → 900
        const color = isTop ? '#e8b84b' : CLOUD_PALETTE[cloudHash(canonical) % CLOUD_PALETTE.length];
        const opacity = (0.55 + t * 0.45).toFixed(2);
        return { size, weight, color, opacity };
      }
      function paintCloudWord(span, g, minC, maxC, isTop, n) {
        const s = cloudStyleFor(g.count, minC, maxC, g.canonical, isTop, n);
        span.style.fontSize = s.size + 'rem';
        span.style.fontWeight = s.weight;
        span.style.color = s.color;
        span.style.opacity = s.opacity;
        span.classList.toggle('is-top', isTop);
      }

      // 螺旋碰撞擺放：最大字從中心開始，其餘往外螺旋找空隙
      function layoutCloud(cloudEl) {
        const W = cloudEl.offsetWidth;
        const H = cloudEl.offsetHeight;
        if (!W || !H) return;
        const CELL = 3, PAD_X = 7, PAD_Y = 5;
        const gcols = Math.ceil(W / CELL);
        const grows = Math.ceil(H / CELL);
        const grid = new Uint8Array(gcols * grows);

        function fits(x, y, w, h) {
          if (x < 0 || y < 0 || x + w > W || y + h > H) return false;
          const c0 = Math.floor(x / CELL), c1 = Math.ceil((x + w) / CELL);
          const r0 = Math.floor(y / CELL), r1 = Math.ceil((y + h) / CELL);
          for (let r = r0; r < r1; r++)
            for (let c = c0; c < c1; c++)
              if (grid[r * gcols + c]) return false;
          return true;
        }
        function mark(x, y, w, h) {
          const c0 = Math.max(0, Math.floor(x / CELL)), c1 = Math.min(gcols, Math.ceil((x + w) / CELL));
          const r0 = Math.max(0, Math.floor(y / CELL)), r1 = Math.min(grows, Math.ceil((y + h) / CELL));
          for (let r = r0; r < r1; r++)
            for (let c = c0; c < c1; c++)
              grid[r * gcols + c] = 1;
        }

        const cx = W / 2, cy = H / 2;
        const aspect = W / H;
        // 依字級大小排序：最大的先放（自然落在中心）
        const spans = Array.from(cloudEl.querySelectorAll('.disp-cloud-word:not(.leaving)'))
          .sort((a, b) => parseFloat(b.style.fontSize) - parseFloat(a.style.fontSize));

        for (const span of spans) {
          const sw = span.offsetWidth + PAD_X * 2;
          const sh = span.offsetHeight + PAD_Y * 2;
          let placed = false;
          for (let step = 0; step < 4000; step++) {
            const angle = step * 0.2;
            const r = step * 0.75;
            const tx = cx + r * Math.cos(angle) * aspect - sw / 2;
            const ty = cy + r * Math.sin(angle) - sh / 2;
            if (fits(tx, ty, sw, sh)) {
              mark(tx, ty, sw, sh);
              span.style.left = (tx + PAD_X) + 'px';
              span.style.top  = (ty + PAD_Y) + 'px';
              placed = true;
              break;
            }
          }
          if (!placed) { span.style.left = '-999px'; span.style.top = '-999px'; }
        }
      }

      // 即時更新：改字級 + 新詞加入 → 重新螺旋排版（CSS transition 讓位置平滑移動）
      function updateCloudWords(cloudEl) {
        const waiting = cloudEl.querySelector('.disp-waiting-text');
        if (waiting) waiting.remove();
        const groups = textVoteGroups;
        const n = groups.length;
        const maxC = groups[0] ? groups[0].count : 1;
        const minC = groups[n - 1] ? groups[n - 1].count : 1;
        const desired = {};
        groups.forEach((g, i) => { desired[g.canonical] = { g, isTop: i === 0 }; });

        // 更新或移除既有節點
        cloudEl.querySelectorAll('.disp-cloud-word').forEach(span => {
          const key = span.dataset.word;
          if (desired[key]) {
            paintCloudWord(span, desired[key].g, minC, maxC, desired[key].isTop, n);
            desired[key].done = true;
          } else if (!span.classList.contains('leaving')) {
            span.classList.add('leaving');
            setTimeout(() => span.remove(), 450);
          }
        });
        // 新增節點（先隱藏，等排版後再 pop 進場）
        const newSpans = [];
        for (const key in desired) {
          if (desired[key].done) continue;
          const { g, isTop } = desired[key];
          const span = document.createElement('span');
          span.className = 'disp-cloud-word';
          span.dataset.word = g.canonical;
          span.textContent = g.canonical;
          span.style.opacity = '0';
          span.style.left = cx_approx(cloudEl) + 'px';
          span.style.top  = cy_approx(cloudEl) + 'px';
          cloudEl.appendChild(span);
          paintCloudWord(span, g, minC, maxC, isTop, n);
          newSpans.push(span);
        }
        // 重新排版，然後 pop 新詞進場
        requestAnimationFrame(() => {
          layoutCloud(cloudEl);
          newSpans.forEach(span => {
            void span.offsetWidth;
            span.classList.add('pop');
            span.addEventListener('animationend', () => span.classList.remove('pop'), { once: true });
          });
        });
      }
      function cx_approx(el) { return (el.offsetWidth  || 500) / 2; }
      function cy_approx(el) { return (el.offsetHeight || 300) / 2; }

      // 首次建立雲：輸出 opacity:0 的 span，由 renderDisplay 呼叫 layoutCloud 後淡入
      function cloudHTML() {
        const groups = textVoteGroups;
        const n = groups.length;
        const maxC = groups[0] ? groups[0].count : 1;
        const minC = n ? groups[n - 1].count : 1;
        return groups.map(g => {
          const isTop = g === groups[0];
          const s = cloudStyleFor(g.count, minC, maxC, g.canonical, isTop, n);
          return `<span class="disp-cloud-word" data-word="${escapeHTML(g.canonical)}"
            style="font-size:${s.size}rem;font-weight:${s.weight};color:${s.color};opacity:0;left:50%;top:50%;">${escapeHTML(g.canonical)}</span>`;
        }).join('');
      }

      function nominationMax() {
        return Math.min(Math.max(parseInt(textVoteData && textVoteData.maxPerPerson) || 2, 1), 5);
      }

      function nominationHTML() {
        const question = (textVoteData && textVoteData.question) || '請提名想參加比賽的人';
        const max = nominationMax();
        const values = Array.from({ length: max }, (_, i) =>
          (textVoteEntries[`${participantName}_${i}`] || {}).text || '');
        const submitted = values.some(v => v);
        const inputs = values.map((val, i) => `
                <input class="nom-input" data-slot="${i}" type="text"
                  placeholder="${i === 0 ? '提名人選（必填）' : `第 ${i + 1} 位（選填）`}"
                  value="${escapeHTML(val)}" autocomplete="off"${i === 0 ? ' required' : ''}>`).join('');
        return `
          <div class="card stack nom-card" style="margin-bottom:12px;">
            <h2 style="font-size:16px;">📝 ${escapeHTML(question)}</h2>
            <form id="nom-form">
              <div style="display:flex;flex-direction:column;gap:8px;">${inputs}
                <button class="btn ${submitted ? 'primary' : 'blue'} full" type="submit">
                  ${submitted ? '✓ 更新提名' : '送出提名'}
                </button>
              </div>
            </form>
          </div>`;
      }

      function textVoteHostHTML() {
        const tvPhase = (textVoteData && textVoteData.phase) || 'inactive';
        const maxCount = (textVoteGroups.length > 0 ? textVoteGroups[0].count : 1) || 1;
        const totalVotes = Object.values(textVoteEntries).filter(e => e && e.text).length;

        if (tvPhase === 'inactive') {
          return `
            <div class="card stack" style="margin-top:14px;">
              <h2 class="section-title">📝 文字提名環節</h2>
              <form id="tv-settings-form">
                <div style="display:flex;flex-direction:column;gap:8px;">
                  <input id="tv-question-input" type="text" placeholder="提問文字" value="請提名想參加比賽的人" style="font-size:14px;">
                  <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">
                    <label style="font-size:13px;color:var(--muted);white-space:nowrap;">每人可提名</label>
                    <input id="tv-max-input" type="number" min="1" max="5" value="2" style="width:56px;font-size:13px;">
                    <label style="font-size:13px;color:var(--muted);white-space:nowrap;">位</label>
                    <button class="btn blue" type="submit" style="margin-left:auto;">開始提名</button>
                  </div>

        const groupsHTML = textVoteGroups.length === 0

                    ? `<select class="tv-merge-select" data-source="${escapeHTML(g.canonical)}"

                  ${tvPhase === 'closed'
                    ? `<input type="checkbox" class="tv-candidate-check" data-name="${escapeHTML(g.canonical)}"

                    : ''}

            }).join('');

        if (tvPhase === 'open') {
          return `
            <div class="card stack" style="margin-top:14px;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <h2 class="section-title" style="margin-bottom:0;flex:1;">
                  📝 ${escapeHTML(textVoteData.question || '提名投票')}
                  <span class="badge open" style="font-size:11px;margin-left:6px;">進行中</span>

                <button class="btn red" type="button" data-action="close-text-vote"

                <div class="hint" style="flex:1;">${totalVotes} 票・${participants.length} 人已加入</div>

                  style="font-size:12px;padding:4px 10px;min-height:28px;white-space:nowrap;">

        }

        // closed
        return `
          <div class="card stack" style="margin-top:14px;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <h2 class="section-title" style="margin-bottom:0;flex:1;">
                📝 ${escapeHTML(textVoteData.question || '提名投票')}
                <span class="badge closed" style="font-size:11px;margin-left:6px;">已結束</span>
              </h2>
              <button class="btn blue" type="button" data-action="publish-candidates"
                style="font-size:12px;padding:4px 10px;min-height:28px;">公布候選名單 ↗</button>

      async function openTextVote() {
        const qEl = document.getElementById('tv-question-input');
        const mEl = document.getElementById('tv-max-input');
        const question = (qEl && qEl.value.trim()) || '請提名想參加比賽的人';
        const maxPerPerson = Math.min(Math.max(parseInt(mEl && mEl.value) || 2, 1), 5);
        await db.ref('/textVote').set({ phase: 'open', question, maxPerPerson, merges: {} });
      }

      async function closeTextVote() {
        if (!confirm('確定結束提名？結束後參與者將無法繼續提名。')) return;
        await db.ref('/textVote/phase').set('closed');
      }

      async function publishCandidates() {
        const checks = document.querySelectorAll('.tv-candidate-check:checked');
        const names = Array.from(checks).map(c => c.dataset.name);
        if (names.length === 0) { alert('請至少勾選一位候選人'); return; }
        await db.ref('/textVote/candidates').set(names);
        await setDisplayMode('textVote');
      }

      async function aiReclassify() {
        const keyInput = document.getElementById('openai-key-input');
        const key = (keyInput && keyInput.value.trim()) || openAiKey;
        if (!key) { alert('請輸入 OpenAI API Key'); return; }
        openAiKey = key;
        localStorage.setItem('openai_key', key);
        const entries = Object.values(textVoteEntries).filter(e => e && e.text);
        const uniqueNames = [...new Set(entries.map(e => e.text.trim()).filter(Boolean))];
        if (uniqueNames.length === 0) { alert('目前沒有提名資料'); return; }
        const btn = document.getElementById('ai-classify-btn');
        if (btn) { btn.disabled = true; btn.textContent = 'AI 分析中...'; }
        try {
          const res = await fetch('https://api.openai.com/v1/chat/completions', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${key}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              model: 'gpt-4o-mini',
              messages: [{ role: 'user', content:
                `你是名字分類助理。以下是投票名單，每個名字可能是同一人的不同寫法（有無姓氏、同音異字、小名）。\n請將可能同一人的名字歸在一組，為每組選最完整的代表名稱。明顯不同人則分開放。\n只回覆純 JSON：{"groups":[{"canonical":"代表名稱","variants":["名字1","名字2"]}]}\n\n名字：\n${uniqueNames.join('\n')}`
              }],
              response_format: { type: 'json_object' }
            })
          });
          if (!res.ok) {
            const err = await res.json().catch(() => ({}));
            throw new Error(err.error?.message || `API 錯誤 ${res.status}`);
          }
          const data = await res.json();
          const { groups } = JSON.parse(data.choices[0].message.content);
          const merges = {};
          for (const g of (groups || [])) {
            if (g.variants && g.variants.length > 0) merges[g.canonical] = g.variants;
          }
          await db.ref('/textVote/merges').set(merges);
        } catch (err) {
          alert('AI 分類失敗：' + err.message);
        } finally {
          if (btn) { btn.disabled = false; btn.textContent = '🤖 AI 重新分類'; }
        }
      }

      async function mergeTextVoteGroups(source, target) {
        const merges = { ...((textVoteData && textVoteData.merges) || {}) };
        const sourceGroup = textVoteGroups.find(g => g.canonical === source);
        const sourceVariants = sourceGroup ? sourceGroup.variants : [source];
        const existing = merges[target] || [];
        merges[target] = [...new Set([...existing, ...sourceVariants, source])];
        delete merges[source];
        await db.ref('/textVote/merges').set(merges);
      }

      async function submitNomination(slot, text) {
        if (!participantName || !text.trim()) { alert('請輸入名字'); return; }
        const key = `${participantName}_${slot}`;
        await db.ref(`/textVoteEntries/${key}`).set({
          voter: participantName, text: text.trim(), slot, timestamp: Date.now()
        });
      }

      async function removeNomination(slot) {
        if (!participantName) return;
        if (!textVoteEntries[`${participantName}_${slot}`]) return;
        await db.ref(`/textVoteEntries/${participantName}_${slot}`).remove();
      }

      // ── Cathedral dust motes ─────────────────────────────────────
      function startDisplayDustMotes() {
        if (dustRaf) { cancelAnimationFrame(dustRaf); dustRaf = null; }
        const cvs = document.getElementById("disp-dust");
        if (!cvs) return;
        const ctx = cvs.getContext("2d");
        function resize() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; }
        resize();
        const onResize = () => resize();
        window.addEventListener("resize", onResize);
        const count = 110;
        const motes = Array.from({ length: count }, () => ({
          x: Math.random() * cvs.width,
          y: Math.random() * cvs.height,
          r: 0.6 + Math.random() * 2.2,
          vx: -0.05 + Math.random() * 0.1,
          vy: -0.14 - Math.random() * 0.28,
          tw: Math.random() * Math.PI * 2,
          a: 0.14 + Math.random() * 0.52,
        }));
        let last = performance.now();
        function tick(t) {
          const dt = Math.min(50, t - last) / 16.67;
          last = t;
          const W = cvs.width, H = cvs.height;
          ctx.clearRect(0, 0, W, H);
          for (const m of motes) {
            m.x += m.vx * dt; m.y += m.vy * dt; m.tw += 0.018 * dt;
            if (m.y < -10) { m.y = H + 10; m.x = Math.random() * W; }
            if (m.x < -10) m.x = W + 10;
            if (m.x > W + 10) m.x = -10;
            const a = m.a * (0.55 + 0.45 * Math.sin(m.tw));
            const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 4);
            g.addColorStop(0, `rgba(255,220,150,${a})`);
            g.addColorStop(1, "rgba(255,220,150,0)");
            ctx.fillStyle = g;
            ctx.beginPath();
            ctx.arc(m.x, m.y, m.r * 4, 0, Math.PI * 2);
            ctx.fill();
          }
          dustRaf = requestAnimationFrame(tick);
        }
        dustRaf = requestAnimationFrame(tick);
      }

      function renderDisplay() {
        // 文字雲原地更新：若已在文字雲畫面且仍在收集中，只 patch 文字（保留塵埃動畫＋平滑長大）
        if (displayMode === "textVote") {

            }
          }
        }
        hostMounted = false;
        participantMounted = false;
        if (dustRaf) { cancelAnimationFrame(dustRaf); dustRaf = null; }
        app.style.background = "transparent";

        // ── 手動直播模式覆蓋 ──────────────────────────────────────
        if (displayMode === "qr") {
          app.innerHTML = `

        if (displayMode === "leaderboard") {

            <div class="disp-root fade-in">
              ${dispBgHTML(false)}

                <div class="disp-final-title">🏅 即時排名</div>

                  ${rankings.length === 0
                    ? `<div class="disp-waiting-text">等待參與者加入...</div>`
                    : rankings.map((row, i) => `
                      <div class="disp-rank-row ${i === 0 ? "is-first" : ""}">
                        <span class="disp-rank-medal">${rankLabel(row.rank)}</span>
                        <span class="disp-rank-name">${escapeHTML(row.name)}</span>
                        <span class="disp-rank-score">${row.correct}<span class="disp-rank-unit"> 場</span></span>
                      </div>`).join("")}
                </div>
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        if (displayMode === "champion") {
          const name = displayChampion;
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(true)}
              <div class="disp-winner-bg"></div>
              <div class="disp-content">
                ${name
                  ? `<div class="disp-trophy">🏆</div>
                     <div class="disp-winner-name">${escapeHTML(name)}</div>
                     <div class="disp-winner-sub">恭喜獲得最終冠軍！</div>`
                  : `<div class="disp-waiting-text">等待公布冠軍...</div>`}
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        if (displayMode === "textVote") {
          computeTextVoteGroups();
          const tvQuestion = (textVoteData && textVoteData.question) || '提名投票';
          const tvCandidates = textVoteData && textVoteData.candidates;
          const tvPhase = textVoteData && textVoteData.phase;
          let listItems;
          if (tvPhase === 'closed' && tvCandidates && tvCandidates.length > 0) {
            listItems = tvCandidates.map((name, i) => {
              const g = textVoteGroups.find(x => x.canonical === name);
              const count = g ? g.count : '?';
              return `
                <div class="disp-nom-row ${i === 0 ? 'is-top' : ''}">

                  <div class="disp-nom-name-wrap">
                    <div class="disp-nom-name">${escapeHTML(name)}</div>
                  </div>
                  <div><span class="disp-nom-count">${count}</span><span class="disp-nom-unit">票</span></div>
                </div>`;
            }).join('');
            app.innerHTML = `
              <div class="disp-root fade-in">
                ${dispBgHTML(false)}
                <div class="disp-content">
                  <div class="disp-nom-title">📝 ${escapeHTML(tvQuestion)}</div>
                  <div class="disp-nom-list">${listItems}</div>
                </div>
              </div>`;
            startDisplayDustMotes();
            return;
          }
          // 收集中 → 即時文字雲
          let cloudInner;
          if (textVoteGroups.length === 0) {
            cloudInner = `<div class="disp-waiting-text">等待提名中...</div>`;
          } else {
            cloudInner = cloudHTML();
          }
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(false)}
              <div class="disp-content">
                <div class="disp-nom-title" id="disp-cloud-title">📝 ${escapeHTML(tvQuestion)}</div>
                <div class="disp-cloud" id="disp-cloud">${cloudInner}</div>
              </div>
            </div>`;
          startDisplayDustMotes();
          // 螺旋排版（需等 DOM render 後才能量測寬度）
          requestAnimationFrame(() => {
            const cloud = document.getElementById('disp-cloud');
            if (!cloud) return;
            layoutCloud(cloud);
            cloud.querySelectorAll('.disp-cloud-word').forEach(span => {
              void span.offsetWidth;
              span.classList.add('pop');
              span.addEventListener('animationend', () => span.classList.remove('pop'), { once: true });
            });
          });
          return;

        // displayMode === "current" → 跳過 phase 判斷，直接顯示當前場次
        if (displayMode === "current") {

        // ── auto 模式（原本邏輯）────────────────────────────────────
        const round = getCurrentRound();
        const intense = (round && round.status === "closed") || game.phase === "finished";

        if (game.phase === "setup") {

            <div class="disp-root fade-in">

                <div class="disp-subtitle">都擊打我</div>

              <div class="disp-content"><div class="disp-waiting-text">等待中...</div></div>

      function renderDisplayRound(round) {
        if (round.status === "pending") {
          app.innerHTML = `
            <div class="disp-root fade-in">

              <div class="disp-content">
                <div class="disp-round-label">${escapeHTML(round.label)}</div>

                <div class="disp-waiting-text">等待開放投票...</div>
              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        if (round.status === "closed") {
          app.innerHTML = `
            <div class="disp-root fade-in">
              ${dispBgHTML(true)}
              <div class="disp-winner-bg"></div>
              <div class="disp-content">

              </div>
            </div>`;
          startDisplayDustMotes();
          return;
        }

        // status === "open"
        const roundPredictions = getPredictionsForRound(round.id);
        const p1Votes = roundPredictions.filter(p => p.pick === round.p1).length;
        const p2Votes = roundPredictions.filter(p => p.pick === round.p2).length;
        const total = p1Votes + p2Votes;
        const p1Pct = total > 0 ? Math.round(p1Votes / total * 100) : 0;
        const p2Pct = total > 0 ? 100 - p1Pct : 0;

        app.innerHTML = `
          <div class="disp-root fade-in">
            ${dispBgHTML(false)}
            <div class="disp-content">
              <div class="disp-round-label">${escapeHTML(round.label)}</div>
              <div class="disp-versus-row">
                <div class="disp-player-name disp-p1-name">${escapeHTML(round.p1)}</div>
                <div class="disp-vs-text">vs</div>
                <div class="disp-player-name disp-p2-name">${escapeHTML(round.p2)}</div>

                <div class="disp-bar-p2-fill"></div>
              </div>
              <div class="disp-stats-row">
                <div class="disp-stat disp-stat-p1">${total > 0 ? `${p1Votes} 票・${p1Pct}%` : '—'}</div>
                <div class="disp-stat-center">${roundPredictions.length} / ${participants.length} 人已投票</div>
                <div class="disp-stat disp-stat-p2">${total > 0 ? `${p2Pct}%・${p2Votes} 票` : '—'}</div>
              </div>
            </div>
          </div>`;
        requestAnimationFrame(() => requestAnimationFrame(() => {
          const b = document.getElementById('disp-bar-p1');
          if (b) b.style.width = (total > 0 ? p1Pct : 50) + '%';
        }));
        startDisplayDustMotes();
      }

      function renderHost() {

        app.style.background = "";
        if (dustRaf) { cancelAnimationFrame(dustRaf); dustRaf = null; }

        if (!hostAuthed) {
          hostMounted = false;
          app.innerHTML = `
            <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;background:radial-gradient(ellipse at 50% 10%, rgba(232,184,75,0.07), transparent 55%);">
              <form id="host-auth-form" class="fade-in" style="width:min(300px,100%);display:flex;flex-direction:column;align-items:center;gap:0;">

                <div style="font-family:'Noto Serif TC',serif;font-size:11px;letter-spacing:0.4em;color:var(--muted);margin-bottom:20px;">— 主持人入口 —</div>

                <div style="font-family:'Noto Serif TC',serif;font-size:28px;font-weight:900;color:var(--gold);letter-spacing:0.06em;line-height:1.2;text-align:center;">你的杖，你的杆，都擊打我</div>

                <div style="width:32px;height:1px;background:var(--border);margin:28px 0;"></div>

                         outline:none;transition:border-color 0.2s;"
                  onfocus="this.style.borderColor='var(--gold-dim)'"
                  onblur="this.style.borderColor='var(--border)'">

                <button type="submit"
                  style="margin-top:32px;width:100%;background:transparent;border:1px solid var(--border);border-radius:6px;
                         color:var(--muted);font-size:12px;letter-spacing:0.25em;padding:11px;
                         font-family:'Noto Sans TC',sans-serif;cursor:pointer;transition:border-color 0.2s,color 0.2s;"
                  onmouseover="this.style.borderColor='var(--gold-dim)';this.style.color='var(--gold)'"

          gamePanelSignature = "";

          app.innerHTML = `
            <div class="host-header">
              <div class="brand">你的杖，你的杆，都擊打我</div>
              <button class="reset-btn" type="button" data-action="reset">重置</button>
            </div>
            <div class="tabs">
              ${TABS.map(([key, label]) => `<button class="tab-btn" type="button" data-tab="${key}">${label}</button>`).join("")}

            <main class="host-main">
              ${TABS.map(([key]) => `<section id="host-panel-${key}" class="panel fade-in"></section>`).join("")}
            </main>
          `;
        }

        updateHostTabs();
        updateSetupPanel();
        updateGamePanel();
        updateRosterPanel();
        updateLeaderboardPanel();
      }

      function updateHostTabs() {
        document.querySelectorAll("[data-tab]").forEach((button) => {
          button.classList.toggle("is-active", button.dataset.tab === hostTab);
        });
        TABS.forEach(([key]) => {
          const panel = document.getElementById(`host-panel-${key}`);
          if (panel) panel.classList.toggle("is-active", key === hostTab);
        });
      }

      function updateSetupPanel() {
        const panel = document.getElementById("host-panel-setup");
        if (!panel) return;

        const sig = `${game.phase}|${game.rounds.map(r => r.id + r.status).join(",")}|${editingRoundId}|${editingTemplateId}`;
        if (sig === setupPanelSignature) return;
        setupPanelSignature = sig;

        const isFinished = game.phase === "finished";
        const isSetup    = game.phase === "setup";

        panel.innerHTML = `
          <div class="stack">

            ${isSetup && game.rounds.length > 0 ? `
              <button class="btn primary full" type="button" data-action="start-game" style="font-size:16px;padding:14px;">
                ▶ 開始遊戲（${game.rounds.length} 場已就緒）
              </button>` : ""}

            <form id="round-form" class="card stack">
              <h2 class="section-title">＋ 新增比賽</h2>

              <div class="form-row">
                <input id="round-p1" type="text" placeholder="選手 A ／左方"

                <input id="round-p2" type="text" placeholder="選手 B ／右方"

              </div>
              <button class="btn blue full" type="submit" ${isFinished ? "disabled" : ""}
                      style="font-size:15px;padding:12px;">

              </button>
              ${isFinished ? `<div class="hint" style="text-align:center;">遊戲已結束，無法新增</div>` : ""}
            </form>

            <div class="card stack">
              <div class="row">
                <h2 class="section-title" style="margin:0;">比賽列表（${game.rounds.length} 場）</h2>
              </div>
              ${game.rounds.length === 0
                ? `<div class="hint" style="padding:16px 0;text-align:center;">尚未新增比賽 ↑ 請在上方填寫後按新增，或從下方載入範本</div>`
                : `<div class="stack">${game.rounds.map((round, idx) => {
                    const isEditing = editingRoundId === round.id;
                    const canEdit   = round.status === "pending";
                    const isCurrent = game.phase === "active" && idx === game.currentRoundIdx;
                    const statusTag = round.status === "closed"
                      ? `<span class="badge closed" style="font-size:11px;">✓ 結束・勝：${escapeHTML(round.winner || "")}</span>`

                        ? `<span class="badge open" style="font-size:11px;">進行中</span>`

                          : `<span class="badge" style="font-size:11px;">待開始</span>`;
                    if (isEditing) {
                      return `
                        <form id="edit-round-form" data-round-id="${escapeHTML(round.id)}"
                              style="background:var(--surface);border:1px solid var(--gold-dim);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;">
                          <div class="hint" style="color:var(--gold);font-weight:700;">編輯比賽</div>
                          <input id="edit-label" type="text" value="${escapeHTML(round.label)}" placeholder="比賽名稱">
                          <div class="form-row">
                            <input id="edit-p1" type="text" value="${escapeHTML(round.p1)}" placeholder="選手 A">
                            <input id="edit-p2" type="text" value="${escapeHTML(round.p2)}" placeholder="選手 B">

                          <div class="form-row">
                            <button class="btn primary" type="submit">✓ 儲存</button>
                            <button class="btn ghost" type="button" data-action="cancel-edit">取消</button>
                          </div>
                        </form>`;
                    }
                    return `
                      <div class="round-item">
                        <div style="flex:1;min-width:0;">
                          <div class="round-name">${escapeHTML(round.label)}</div>
                          <div class="hint" style="margin-top:3px;">${escapeHTML(round.p1)} vs ${escapeHTML(round.p2)}</div>
                          <div style="margin-top:5px;">${statusTag}</div>
                        </div>
                        ${canEdit ? `
                        <div style="display:flex;flex-direction:column;gap:5px;flex-shrink:0;">
                          <button class="btn ghost" type="button" data-action="edit-round"
                                  data-round-id="${escapeHTML(round.id)}" style="font-size:12px;padding:4px 12px;">✏ 編輯</button>
                          <button class="btn red" type="button" data-action="remove-round"
                                  data-round-id="${escapeHTML(round.id)}" style="font-size:12px;padding:4px 12px;">✕ 刪除</button>
                        </div>` : ""}
                      </div>`;
                  }).join("")}</div>`}
            </div>
            <div class="card qr-card">
              <div class="row" style="margin-bottom:10px;">
                <h2 class="section-title" style="margin:0;">參與 QR Code</h2>
                <button class="btn ghost" type="button" data-action="open-qr" style="font-size:12px;padding:4px 12px;">↗ 新視窗</button>
              </div>
              <div id="qr-box" class="qr-box"></div>
            </div>

            ${(() => {
              const templates = loadTemplates();
              return `
              <div class="card stack">
                <div class="row">
                  <h2 class="section-title" style="margin:0;">📋 已儲存範本</h2>
                  ${game.rounds.length > 0 && !isFinished ? `
                    <form id="save-template-form" style="display:flex;gap:6px;align-items:center;">
                      <input id="template-name-input" type="text" placeholder="範本名稱（選填）"
                             style="width:130px;padding:6px 10px;font-size:13px;">
                      <button class="btn ghost" type="submit" style="white-space:nowrap;font-size:13px;padding:6px 12px;">
                        ＋ 儲存目前
                      </button>
                    </form>` : ""}
                </div>
                ${templates.length === 0
                  ? `<div class="hint">尚無範本。新增比賽後按「儲存目前」即可儲存。</div>`
                  : templates.map(t => {
                    if (editingTemplateId === t.id) {
                      return `
                        <form id="rename-template-form" data-template-id="${escapeHTML(t.id)}"
                              style="display:flex;gap:6px;align-items:center;">
                          <input id="rename-template-input" type="text" value="${escapeHTML(t.name)}"
                                 placeholder="範本名稱" style="flex:1;">
                          <button class="btn primary" type="submit" style="font-size:12px;padding:6px 12px;white-space:nowrap;">✓ 確認</button>
                          <button class="btn ghost" type="button" data-action="cancel-rename-template"
                                  style="font-size:12px;padding:6px 10px;">✕</button>
                        </form>`;
                    }
                    return `
                      <div class="round-item">
                        <div style="flex:1;min-width:0;">
                          <div class="round-name">${escapeHTML(t.name)}</div>
                          <div class="hint">${t.rounds.length} 場：${t.rounds.map(r => escapeHTML(r.p1) + " vs " + escapeHTML(r.p2)).join("、")}</div>
